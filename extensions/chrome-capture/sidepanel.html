<!doctype html><html><head><meta charset="utf-8"><title>CloudCLI Fix This</title><link rel="stylesheet" href="sidepanel.css"></head><body>
<main><h1>CloudCLI Fix This</h1><p id="status" role="status">Connect to your CloudCLI server.</p>
<label>Server URL<input id="server" type="url" placeholder="http://127.0.0.1:3000"></label>
<label>Bearer token<input id="token" type="password" autocomplete="off" placeholder="JWT token"></label>
<button id="connect">Save & load projects</button>
<label>Project<select id="project"><option value="">Connect first</option></select></label>
<label>Task title<input id="title" maxlength="300" placeholder="What should be fixed?"></label>
<label>Expected behavior<textarea id="expected" maxlength="20000" rows="3"></textarea></label>
<div class="actions"><button id="select">Select element</button><button id="screenshot">Screenshot</button></div>
<div class="actions"><button id="record">Start recording</button><button id="stop" disabled>Stop recording</button></div>
<label>Selected element<pre id="element">None</pre></label>
<label>Selected text<textarea id="selected" maxlength="20000" rows="3" placeholder="Select text on the page, then click capture"></textarea></label>
<button id="submit" class="primary">Fix This</button></main><script src="sidepanel.js" type="module"></script></body></html>
