  function escapeHtml(s) {
    if (!s) { return ''; }
    s = String(s);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function escapeAttr(s) {
    return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function boldItalic(s) {
    s = s.replace(/(\*\*|__)([^\n]+?)\1/g, '<strong>$2</strong>');
    s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
    s = s.replace(/(^|[^A-Za-z0-9_])_([^_\n]+)_(?![A-Za-z0-9_])/g, '$1<em>$2</em>');
    return s;
  }

  function renderMarkdown(raw) {
    var text = escapeHtml(raw);
    var MARK = 'MDTOK' + Math.floor(Math.random() * 1e9) + 'X';

    var blocks = [];
    text = text.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, function (m, lang, code) {
      var idx = blocks.length;
      var c = code.replace(/\n$/, '');
      blocks.push('<pre><code>' + c + '</code></pre>');
      return MARK + 'B' + idx + 'E';
    });

    var inlineCode = [];
    text = text.replace(/`([^`\n]+)`/g, function (m, code) {
      var idx = inlineCode.length;
      inlineCode.push('<code>' + code + '</code>');
      return MARK + 'I' + idx + 'E';
    });

    var links = [];
    text = text.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, function (m, label, url) {
      var idx = links.length;
      var u = url.replace(/^\s+|\s+$/g, '');
      var html;
      if (/^(https?:|mailto:)/i.test(u)) {
        html = '<a href="' + escapeAttr(u) + '" target="_blank" rel="noopener noreferrer">' + boldItalic(label) + '</a>';
      } else {
        html = boldItalic(label);
      }
      links.push(html);
      return MARK + 'L' + idx + 'E';
    });

    var lines = text.split('\n');
    var out = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      var trimmed = line.replace(/^\s+|\s+$/g, '');
      if (trimmed === '') { i++; continue; }

      var blockMatch = trimmed.match(new RegExp('^' + MARK + 'B(\\d+)E$'));
      if (blockMatch) {
        out.push(blocks[Number(blockMatch[1])]);
        i++;
        continue;
      }

      var h = line.match(/^(#{1,3})\s+(.*)$/);
      if (h) {
        var level = h[1].length;
        out.push('<h' + level + '>' + boldItalic(h[2]) + '</h' + level + '>');
        i++;
        continue;
      }

      if (/^>\s?/.test(line)) {
        var qlines = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          qlines.push(boldItalic(lines[i].replace(/^>\s?/, '')));
          i++;
        }
        out.push('<blockquote><p>' + qlines.join('<br>') + '</p></blockquote>');
        continue;
      }

      var sepRe = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;
      if (line.indexOf('|') !== -1 && i + 1 < lines.length && sepRe.test(lines[i + 1])) {
        var splitRow = function (rowLine) {
          var cells = rowLine.replace(/^\s+|\s+$/g, '').replace(/^\|/, '').replace(/\|$/, '').split('|');
          var out2 = [];
          for (var ci = 0; ci < cells.length; ci++) {
            out2.push(boldItalic(cells[ci].replace(/^\s+|\s+$/g, '')));
          }
          return out2;
        };
        var headCells = splitRow(line);
        var theadHtml = '<tr>';
        for (var hc = 0; hc < headCells.length; hc++) {
          theadHtml += '<th>' + headCells[hc] + '</th>';
        }
        theadHtml += '</tr>';
        i += 2;
        var bodyRows = [];
        while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].replace(/^\s+|\s+$/g, '') !== '') {
          var rowCells = splitRow(lines[i]);
          var rowHtml = '<tr>';
          for (var rc = 0; rc < rowCells.length; rc++) {
            rowHtml += '<td>' + rowCells[rc] + '</td>';
          }
          rowHtml += '</tr>';
          bodyRows.push(rowHtml);
          i++;
        }
        out.push('<div class="md-table-wrap"><table class="md-table"><thead>' + theadHtml + '</thead><tbody>' + bodyRows.join('') + '</tbody></table></div>');
        continue;
      }

      if (/^[-*]\s+/.test(line)) {
        var ulItems = [];
        while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
          ulItems.push('<li>' + boldItalic(lines[i].replace(/^[-*]\s+/, '')) + '</li>');
          i++;
        }
        out.push('<ul>' + ulItems.join('') + '</ul>');
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        var olItems = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
          olItems.push('<li>' + boldItalic(lines[i].replace(/^\d+\.\s+/, '')) + '</li>');
          i++;
        }
        out.push('<ol>' + olItems.join('') + '</ol>');
        continue;
      }

      var pLines = [];
      while (i < lines.length) {
        var t = lines[i].replace(/^\s+|\s+$/g, '');
        if (t === '') { break; }
        if (new RegExp('^' + MARK + 'B\\d+E$').test(t)) { break; }
        if (/^(#{1,3})\s+/.test(lines[i])) { break; }
        if (/^>\s?/.test(lines[i])) { break; }
        if (/^[-*]\s+/.test(lines[i])) { break; }
        if (/^\d+\.\s+/.test(lines[i])) { break; }
        pLines.push(boldItalic(lines[i]));
        i++;
      }
      out.push('<p>' + pLines.join('<br>') + '</p>');
    }

    var html = out.join('');
    html = html.replace(new RegExp(MARK + 'L(\\d+)E', 'g'), function (m, idx) { return links[Number(idx)]; });
    html = html.replace(new RegExp(MARK + 'I(\\d+)E', 'g'), function (m, idx) { return inlineCode[Number(idx)]; });
    return html;
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function formatLastActivity(value) {
    if (!value) { return ''; }
    var d = new Date(value);
    if (isNaN(d.getTime())) { return String(value); }
    return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function sessionTitle(s) {
    if (s.summary && String(s.summary).length) {
      return s.summary;
    }
    if (s.name && String(s.name).length) {
      return s.name;
    }
    if (s.title && String(s.title).length) {
      return s.title;
    }
    var when = formatLastActivity(s.lastActivity);
    return when ? ('Chat ' + when) : 'Chat';
  }

  // ---- Providers ----

  function loadProviders() {
    xhr('GET', '/api/providers/capabilities', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var providers = (payload && payload.providers) || [];
      state.providers = providers;
      state.capabilities = {};
      for (var i = 0; i < providers.length; i++) {
        state.capabilities[providers[i].provider] = providers[i];
      }
      var sel = $('providerSelect');
      sel.innerHTML = '';
      var savedProvider = getStoredItem(PROVIDER_KEY);
      var haveSaved = false;
      for (var j = 0; j < providers.length; j++) {
        var opt = document.createElement('option');
        opt.value = providers[j].provider;
        opt.innerHTML = escapeHtml(providers[j].provider);
        sel.appendChild(opt);
        if (providers[j].provider === savedProvider) { haveSaved = true; }
      }
      if (haveSaved) { sel.value = savedProvider; }
      onProviderChange();
    }, function () {});
  }

  function currentCapabilities() {
    var provider = $('providerSelect').value;
    return state.capabilities[provider] || null;
  }

  function onProviderChange() {
    var provider = $('providerSelect').value;
    setStoredItem(PROVIDER_KEY, provider);
    loadModelsForProvider(provider);
    renderPermissionModeOptions();
  }

  function loadModelsForProvider(provider) {
    var modelSel = $('modelSelect');
    modelSel.innerHTML = '';
    if (!provider) { return; }
    if (state.modelsByProvider[provider]) {
      renderModelOptions(state.modelsByProvider[provider]);
      return;
    }
    xhr('GET', '/api/providers/' + encodeURIComponent(provider) + '/models', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var models = (payload && payload.models) || null;
      state.modelsByProvider[provider] = models;
      if (provider === $('providerSelect').value) {
        renderModelOptions(models);
      }
    }, function () {});
  }

  function renderModelOptions(models) {
    var modelSel = $('modelSelect');
    modelSel.innerHTML = '';
    var options = (models && models.OPTIONS) || [];
    var savedModel = getStoredItem(MODEL_KEY);
    var haveSaved = false;
    for (var i = 0; i < options.length; i++) {
      var opt = document.createElement('option');
      opt.value = options[i].value;
      opt.innerHTML = escapeHtml(options[i].label || options[i].value);
      modelSel.appendChild(opt);
      if (options[i].value === savedModel) { haveSaved = true; }
    }
    if (haveSaved) {
      modelSel.value = savedModel;
    } else if (models && models.DEFAULT) {
      modelSel.value = models.DEFAULT;
    }
    renderEffortOptions(options);
  }

  function currentModelOption(options) {
    var modelSel = $('modelSelect');
    for (var i = 0; i < options.length; i++) {
      if (options[i].value === modelSel.value) { return options[i]; }
    }
    return null;
  }

  function renderEffortOptions(options) {
    var effortSel = $('effortSelect');
    effortSel.innerHTML = '';
    var caps = currentCapabilities();
    if (!caps || !caps.supportsEffort) {
      effortSel.style.display = 'none';
      effortSel.previousElementSibling.style.display = 'none';
      return;
    }
    var modelOpt = currentModelOption(options || (state.modelsByProvider[$('providerSelect').value] || {}).OPTIONS || []);
    var values = (modelOpt && modelOpt.effort && modelOpt.effort.values) || [];
    if (!values.length) {
      effortSel.style.display = 'none';
      effortSel.previousElementSibling.style.display = 'none';
      return;
    }
    effortSel.style.display = '';
    effortSel.previousElementSibling.style.display = '';
    var savedEffort = getStoredItem(EFFORT_KEY);
    var haveSaved = false;
    for (var i = 0; i < values.length; i++) {
      var opt = document.createElement('option');
      opt.value = values[i].value;
      opt.innerHTML = escapeHtml(values[i].value);
      effortSel.appendChild(opt);
      if (values[i].value === savedEffort) { haveSaved = true; }
    }
    var def = (modelOpt && modelOpt.effort && modelOpt.effort.default) || '';
    if (haveSaved) {
      effortSel.value = savedEffort;
    } else if (def) {
      effortSel.value = def;
    }
  }

  function renderPermissionModeOptions() {
    var permSel = $('permissionModeSelect');
    permSel.innerHTML = '';
    var caps = currentCapabilities();
    var modes = (caps && caps.permissionModes) || [];
    var savedMode = getStoredItem(PERMISSION_KEY);
    var haveSaved = false;
    for (var i = 0; i < modes.length; i++) {
      var opt = document.createElement('option');
      opt.value = modes[i];
      opt.innerHTML = escapeHtml(modes[i]);
      permSel.appendChild(opt);
      if (modes[i] === savedMode) { haveSaved = true; }
    }
    if (haveSaved) {
      permSel.value = savedMode;
    } else if (caps && caps.defaultPermissionMode) {
      permSel.value = caps.defaultPermissionMode;
    }
  }

  // ---- Sessions ----

  function setSessionsLoadMoreBusy(busy) {
    var btn = $('btnLoadMoreSessions');
    state.sessionsLoading = !!busy;
    if (!btn) { return; }
    btn.disabled = !!busy;
    if (busy) {
      btn.innerHTML = '<span class="btnSpinner"><span></span><span></span><span></span></span>Loading';
      btn.style.display = 'inline-block';
    } else {
      btn.innerHTML = '';
      btn.appendChild(document.createTextNode('Load more'));
    }
  }

  function loadSessions(onDone, append) {
    if (append && state.sessionsLoading) { return; }
    if (!append) { state.sessionsOffset = 0; state.sessionsArchived = false; }
    var offset = append ? state.sessionsOffset : 0;
    if (append) { setSessionsLoadMoreBusy(true); }
    xhr('GET', '/api/projects/' + encodeURIComponent(state.currentProjectId) + '/sessions?limit=20&offset=' + encodeURIComponent(String(offset)), null, authHeaders(), function (data) {
      if (append) { setSessionsLoadMoreBusy(false); }
      var list = [];
      if (data && Array.isArray(data.sessions)) {
        list = data.sessions;
      } else if (Array.isArray(data)) {
        list = data;
      }
      state.sessions = append ? state.sessions.concat(list) : list;
      state.sessionsOffset = offset + list.length;
      state.sessionsHasMore = list.length === 20;
      renderSessions();
      showScreen('screenSessions');
      updateHashAndNav('screenSessions', {
        categoryId: state.currentCategoryId,
        categoryName: state.currentCategoryName,
        projectId: state.currentProjectId,
        projectName: state.currentProjectName
      });
      if (onDone) { onDone(); }
    }, function (data) {
      if (append) { setSessionsLoadMoreBusy(false); }
      setErr((data && data.error) || 'Failed to load sessions');
      if (onDone) { onDone(); }
    });
  }

  function reloadProjectsForRefresh(onDone) {
    xhr('GET', '/api/projects', null, authHeaders(), function (projData) {
      var projects = Array.isArray(projData) ? projData : [];
      state.projects = projects;
      renderProjects();
      if (onDone) { onDone(); }
    }, function () {
      if (onDone) { onDone(); }
    });
  }

  function renderSessions() {
    var el = $('sessionList');
    el.innerHTML = '';
    var sessions = state.sessions;
    if (!sessions || !Array.isArray(sessions)) {
      sessions = [];
    }
    var lastId = getLastSession(state.currentProjectId);
    for (var i = 0; i < sessions.length; i++) {
      (function (s) {
        var row = document.createElement('div');
        var sid = s.sessionId || s.id;
        var title = sessionTitle(s);
        row.className = (lastId && sid === lastId) ? 'row rowLast' : 'row';
        var main = document.createElement('div');
        main.innerHTML = '<div>' + escapeHtml(title) + '</div><div class="meta">' + escapeHtml(sid) + '</div>';
        main.style.webkitBoxFlex = '1';
        main.style.webkitFlex = '1';
        main.style.flex = '1';
        main.onclick = function () {
          openChat(sid, title, s.provider || '');
        };
        row.appendChild(main);
        var actions = document.createElement('div');
        actions.className = 'rowActions';
        var rename = document.createElement('button');
        rename.className = 'secondary'; rename.appendChild(document.createTextNode('Rename'));
        rename.onclick = function (evt) {
          if (evt && evt.stopPropagation) { evt.stopPropagation(); }
          var next = window.prompt('Session name', title);
          if (!next || next === title) { return; }
          xhr('PUT', '/api/providers/sessions/' + encodeURIComponent(sid), { summary: next }, authHeaders(), function () { loadSessions(); }, function (d) { setErr((d && d.error) || 'Rename failed'); });
        };
        var archive = document.createElement('button');
        archive.className = 'secondary'; archive.appendChild(document.createTextNode('Archive'));
        archive.onclick = function (evt) {
          if (evt && evt.stopPropagation) { evt.stopPropagation(); }
          if (!window.confirm('Archive this session?')) { return; }
          xhr('DELETE', '/api/providers/sessions/' + encodeURIComponent(sid), null, authHeaders(), function () { loadSessions(); }, function (d) { setErr((d && d.error) || 'Archive failed'); });
        };
        actions.appendChild(rename); actions.appendChild(archive); row.appendChild(actions);
        el.appendChild(row);
      })(sessions[i]);
    }
    $('btnLoadMoreSessions').style.display = state.sessionsArchived || !state.sessionsHasMore ? 'none' : 'inline-block';
  }

  function loadArchivedSessions() {
    xhr('GET', '/api/providers/sessions/archived', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      state.sessions = (payload && payload.sessions) || (Array.isArray(payload) ? payload : []);
      state.sessionsArchived = true;
      state.sessionsHasMore = false;
      var el = $('sessionList'); el.innerHTML = '';
      for (var i = 0; i < state.sessions.length; i++) {
        (function (s) {
          var sid = s.sessionId || s.id;
          var row = document.createElement('div'); row.className = 'row';
          row.innerHTML = '<div><div>' + escapeHtml(sessionTitle(s)) + '</div><div class="meta">' + escapeHtml(sid) + '</div></div>';
          var restore = document.createElement('button'); restore.className = 'secondary small'; restore.appendChild(document.createTextNode('Restore'));
          restore.onclick = function () { xhr('POST', '/api/providers/sessions/' + encodeURIComponent(sid) + '/restore', {}, authHeaders(), function () { loadArchivedSessions(); }, function (d) { setErr((d && d.error) || 'Restore failed'); }); };
          row.appendChild(restore); el.appendChild(row);
        })(state.sessions[i]);
      }
      $('btnLoadMoreSessions').style.display = 'none';
    }, function (d) { setErr((d && d.error) || 'Failed to load archived sessions'); });
  }

  function onNewSessionClick() {
    if (!isSessionSetupOpen()) {
      setSessionSetupOpen(true);
      return;
    }
    newSession();
  }

  function newSession() {
    var provider = $('providerSelect').value;
    if (!provider) {
      setErr('No provider available');
      return;
    }
    var model = $('modelSelect').value || '';
    var effort = ($('effortSelect').style.display !== 'none') ? ($('effortSelect').value || '') : '';
    var permissionMode = $('permissionModeSelect').value || '';

    setStoredItem(PROVIDER_KEY, provider);
    if (model) { setStoredItem(MODEL_KEY, model); }
    if (effort) { setStoredItem(EFFORT_KEY, effort); }
    if (permissionMode) { setStoredItem(PERMISSION_KEY, permissionMode); }

    xhr('POST', '/api/providers/sessions', { provider: provider, projectId: state.currentProjectId, permissionMode: permissionMode }, authHeaders(), function (data) {
      var payload = unwrap(data);
      var sessionId = (payload && payload.sessionId) || (data && data.sessionId);
      if (sessionId) {
        var options = {};
        if (model) { options.model = model; }
        if (effort) { options.effort = effort; }
        state.sessionOptions[sessionId] = options;
        openChat(sessionId, 'Chat', provider);
      } else {
        setErr('Failed to create session');
      }
    }, function (data) {
      setErr((data && data.error) || 'Failed to create session');
    });
  }

  // ---- Chat ----

  function openChat(sessionId, title, provider) {
    saveCurrentDraft();
    state.manualWsClose = true;
    if (state.ws) { try { state.ws.close(); } catch (closeErr) {} }
    state.currentSessionId = sessionId;
    state.currentSessionProvider = provider || '';
    state.lastAssistantEl = null;
    state.streamingText = '';
    state.messagesOffset = 0;
    state.messagesHasMore = false;
    state.messagesLoading = false;
    setThinking(false);
    setLastSession(state.currentProjectId, sessionId);
    $('chatTitle').innerHTML = escapeHtml(title || 'Chat');
    $('chatList').innerHTML = '';
    hideTyping();
    showScreen('screenChat');
    updateHashAndNav('screenChat', {
      sessionId: sessionId,
      projectId: state.currentProjectId,
      categoryId: state.currentCategoryId,
      title: title || 'Chat',
      provider: state.currentSessionProvider
    });
    loadMessages(sessionId);
    connectWs();
    hydrateSessionPermissionMode(sessionId);
    $('chatInput').value = loadDraft(sessionId);
  }

  function persistSessionPermissionMode(mode) {
    if (!mode) { return; }
    setStoredItem(PERMISSION_KEY, mode);
    if (!state.currentSessionId) { return; }
    var sent = false;
    if (state.wsSend && state.wsConnected) {
      sent = !!state.wsSend({
        type: 'chat.session-preferences',
        sessionId: state.currentSessionId,
        preferences: { permissionMode: mode }
      });
    }
    if (!sent) {
      xhr(
        'PUT',
        '/api/providers/sessions/' + encodeURIComponent(state.currentSessionId) + '/runtime-preferences',
        { permissionMode: mode },
        authHeaders(),
        function () {},
        function () {}
      );
    }
  }

  function hydrateSessionPermissionMode(sessionId) {
    xhr('GET', '/api/providers/sessions/' + encodeURIComponent(sessionId) + '/meta', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var session = payload && payload.session;
      var mode = session && session.permissionMode;
      if (!mode) { return; }
      var permSel = $('permissionModeSelect');
      if (!permSel) { return; }
      var options = permSel.options;
      var found = false;
      for (var i = 0; i < options.length; i++) {
        if (options[i].value === mode) { found = true; break; }
      }
      if (found) {
        permSel.value = mode;
        setStoredItem(PERMISSION_KEY, mode);
      }
    }, function () {});
  }

  function messagesUrl(sessionId, limit, offset) {
    return '/api/providers/sessions/' + encodeURIComponent(sessionId) +
      '/messages?limit=' + encodeURIComponent(String(limit)) +
      '&offset=' + encodeURIComponent(String(offset));
  }

  function updateLoadOlderButton() {
    var list = $('chatList');
    var existing = $('loadOlderBtn');
    if (!state.messagesHasMore) {
      if (existing && existing.parentNode) {
        existing.parentNode.removeChild(existing);
      }
      return;
    }
    if (!existing) {
      existing = document.createElement('button');
      existing.id = 'loadOlderBtn';
      existing.type = 'button';
      existing.className = 'secondary';
      existing.appendChild(document.createTextNode('Load older'));
      existing.onclick = function () { loadOlderMessages(); };
    }
    existing.disabled = !!state.messagesLoading;
    existing.style.opacity = state.messagesLoading ? '0.45' : '';
    if (list.firstChild !== existing) {
      list.insertBefore(existing, list.firstChild);
    }
  }

  function applyMessagesPage(payload, opts) {
    opts = opts || {};
    var messages = (payload && payload.messages) || [];
    var reqOffset = (typeof opts.reqOffset === 'number') ? opts.reqOffset : 0;
    state.messagesHasMore = !!(payload && payload.hasMore);
    state.messagesOffset = reqOffset + messages.length;
    return messages;
  }

  function loadMessages(sessionId) {
    state.messagesLoading = true;
    xhr('GET', messagesUrl(sessionId, MSG_PAGE_LIMIT, 0), null, authHeaders(), function (data) {
      state.messagesLoading = false;
      if (state.currentSessionId !== sessionId) { return; }
      var payload = unwrap(data);
      var messages = applyMessagesPage(payload, { reqOffset: 0 });
      $('chatList').innerHTML = '';
      state.lastAssistantEl = null;
      for (var i = 0; i < messages.length; i++) {
        renderMessage(messages[i]);
      }
      updateLoadOlderButton();
      scrollChatToBottom();
    }, function () {
      state.messagesLoading = false;
      updateLoadOlderButton();
    });
  }

  function loadOlderMessages() {
    if (!state.messagesHasMore || state.messagesLoading) { return; }
    var sessionId = state.currentSessionId;
    if (!sessionId) { return; }
    var list = $('chatList');
    var prevHeight = list.scrollHeight;
    var prevTop = list.scrollTop;
    var nextOffset = state.messagesOffset;
    state.messagesLoading = true;
    updateLoadOlderButton();
    xhr('GET', messagesUrl(sessionId, MSG_PAGE_LIMIT, nextOffset), null, authHeaders(), function (data) {
      state.messagesLoading = false;
      if (state.currentSessionId !== sessionId) { return; }
      var payload = unwrap(data);
      var messages = applyMessagesPage(payload, { reqOffset: nextOffset });
      var anchor = $('loadOlderBtn');
      var insertBeforeNode = anchor ? anchor.nextSibling : list.firstChild;
      var frag = document.createDocumentFragment();
      var created = [];
      for (var i = 0; i < messages.length; i++) {
        var el = buildMessageEl(messages[i]);
        if (el) {
          created.push(el);
          frag.appendChild(el);
        }
      }
      if (created.length) {
        list.insertBefore(frag, insertBeforeNode);
      }
      updateLoadOlderButton();
      list.scrollTop = prevTop + (list.scrollHeight - prevHeight);
    }, function () {
      state.messagesLoading = false;
      updateLoadOlderButton();
    });
  }

  function reloadMessagesForRefresh(onDone) {
    var sessionId = state.currentSessionId;
    state.messagesOffset = 0;
    state.messagesHasMore = false;
    state.messagesLoading = true;
    xhr('GET', messagesUrl(sessionId, MSG_PAGE_LIMIT, 0), null, authHeaders(), function (data) {
      state.messagesLoading = false;
      if (state.currentSessionId !== sessionId) {
        if (onDone) { onDone(); }
        return;
      }
      var payload = unwrap(data);
      var messages = applyMessagesPage(payload, { reqOffset: 0 });
      $('chatList').innerHTML = '';
      state.lastAssistantEl = null;
      for (var i = 0; i < messages.length; i++) {
        renderMessage(messages[i]);
      }
      updateLoadOlderButton();
      scrollChatToBottom();
      if (onDone) { onDone(); }
    }, function () {
      state.messagesLoading = false;
      updateLoadOlderButton();
      if (onDone) { onDone(); }
    });
  }

  function isJsonDump(s) {
    if (typeof s !== 'string') { return true; }
    var trimmed = s.replace(/^\s+/, '');
    return trimmed.charAt(0) === '{';
  }

  function shouldRenderMessage(m) {
    if (!m) { return false; }
    if (m.kind === 'text') { return true; }
    var role = m.role;
    if (role !== 'user' && role !== 'assistant') { return false; }
    if (m.kind && DROP_KINDS.hasOwnProperty(m.kind)) { return false; }
    var text = m.displayText;
    if (typeof text !== 'string' && typeof m.content === 'string') {
      text = m.content;
    }
    if (typeof text !== 'string' || !text.length) { return false; }
    if (isJsonDump(text)) { return false; }
    return true;
  }

  function messageText(m) {
    if (typeof m.displayText === 'string') { return m.displayText; }
    if (typeof m.content === 'string') { return m.content; }
    return '';
  }

  function buildMessageEl(m) {
    if (!shouldRenderMessage(m)) { return null; }
    var text = messageText(m);
    if (!text) { return null; }
    var role = m.role;
    var div = document.createElement('div');
    div.className = role === 'user' ? 'msg user' : 'msg assistant';
    div._copyText = text;

    var body = document.createElement('div');
    body.className = 'msgBody';
    body.innerHTML = renderMarkdown(text);
    div.appendChild(body);

    var meta = document.createElement('div');
    meta.className = 'msgMeta';
    var timeEl = document.createElement('span');
    timeEl.className = 'msgTime';
    timeEl.appendChild(document.createTextNode(formatMsgTime(m.timestamp)));
    meta.appendChild(timeEl);

    var copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'msgCopy';
    copyBtn.appendChild(document.createTextNode('Copy'));
    copyBtn.onclick = function (evt) {
      if (evt && evt.stopPropagation) { evt.stopPropagation(); }
      if (evt && evt.preventDefault) { evt.preventDefault(); }
      copyPlainText(div._copyText || '');
      return false;
    };
    meta.appendChild(copyBtn);
    div.appendChild(meta);
    return div;
  }

  function renderMessage(m) {
    var div = buildMessageEl(m);
    if (!div) { return; }
    $('chatList').appendChild(div);
    if (m.role === 'assistant') {
      state.lastAssistantEl = div;
      state.streamingText = div._copyText || '';
    } else {
      state.lastAssistantEl = null;
      state.streamingText = '';
    }
    keepTypingAtBottom();
  }

  function scrollChatToBottom() {
    var el = $('chatList');
    el.scrollTop = el.scrollHeight;
  }

  function showTyping() {
    if ($('typingIndicator')) { return; }
    var div = document.createElement('div');
    div.id = 'typingIndicator';
    div.className = 'msg assistant typing';
    div.innerHTML = '<span class="typingDots"><span></span><span></span><span></span></span>Thinking';
    $('chatList').appendChild(div);
    scrollChatToBottom();
  }

  function hideTyping() {
    var el = $('typingIndicator');
    if (el && el.parentNode) { el.parentNode.removeChild(el); }
  }

  function keepTypingAtBottom() {
    var el = $('typingIndicator');
    if (el) { $('chatList').appendChild(el); }
  }

  function wsUrl() {
    var proto = (window.location.protocol === 'https:') ? 'wss:' : 'ws:';
    return proto + '//' + window.location.host + '/ws?token=' + encodeURIComponent(state.token);
  }

  function setConnectionStatus(text, css) {
    var el = $('connectionStatus');
    if (!el) { return; }
    el.className = 'connectionStatus' + (css ? ' ' + css : '');
    el.innerHTML = escapeHtml(text || 'Offline');
  }

  function clearWsReconnect() {
    if (state.wsReconnectTimer) { clearTimeout(state.wsReconnectTimer); state.wsReconnectTimer = null; }
  }

  function scheduleWsReconnect() {
    if (state.manualWsClose || state.activeScreen !== 'screenChat' || !state.currentSessionId) { return; }
    clearWsReconnect();
    state.wsReconnectAttempts += 1;
    var delay = Math.min(15000, 1000 * Math.pow(2, Math.min(state.wsReconnectAttempts - 1, 4)));
    setConnectionStatus('Retry ' + Math.ceil(delay / 1000) + 's', 'offline');
    state.wsReconnectTimer = setTimeout(function () { connectWs(true); }, delay);
  }

  function connectWs(isRetry) {
    if (!state.currentSessionId || state.activeScreen !== 'screenChat') { return; }
    clearWsReconnect();
    if (state.ws) {
      if (state.ws.readyState === 0 || state.ws.readyState === 1) {
        if (isRetry) { return; }
      }
      state.manualWsClose = true;
      try { state.ws.close(); } catch (e) {}
      state.ws = null;
    }
    state.manualWsClose = false;
    state.wsGeneration += 1;
    var generation = state.wsGeneration;
    var subscribedSessionId = state.currentSessionId;
    setConnectionStatus(isRetry ? 'Reconnecting' : 'Connecting', '');
    var ws = new WebSocket(wsUrl());
    state.ws = ws;
    ws.onopen = function () {
      if (generation !== state.wsGeneration) { try { ws.close(); } catch (e0) {} return; }
      state.wsConnected = true;
      state.wsReconnectAttempts = 0;
      setConnectionStatus('Online', 'online');
      send({ type: 'chat.subscribe', sessions: [{ sessionId: state.currentSessionId }] });
    };
    ws.onmessage = function (evt) {
      if (generation !== state.wsGeneration || subscribedSessionId !== state.currentSessionId) { return; }
      var data = null;
      try {
        data = JSON.parse(evt.data);
      } catch (e) {
        return;
      }
      handleWsFrame(data);
    };
    ws.onclose = function () {
      if (generation !== state.wsGeneration) { return; }
      state.wsConnected = false;
      state.wsSend = null;
      setConnectionStatus(navigator.onLine === false ? 'Offline' : 'Disconnected', 'offline');
      if (state.thinking) { hideTyping(); setThinking(false); setErr('Connection lost before the reply completed.'); }
      scheduleWsReconnect();
    };
    ws.onerror = function () { setConnectionStatus('Connection error', 'offline'); };

    function send(obj) {
      if (ws.readyState === 1) {
        ws.send(JSON.stringify(obj));
        return true;
      }
      return false;
    }
    state.wsSend = send;
  }

  function truncateJson(obj, max) {
    var s;
    try {
      s = JSON.stringify(obj);
    } catch (e) {
      s = String(obj);
    }
    if (!s) { return ''; }
    if (s.length > max) {
      s = s.substring(0, max) + '...';
    }
    return s;
  }

  function renderPermissionCard(requestId, toolName, input) {
    var card = document.createElement('div');
    card.className = 'permCard';

    var title = document.createElement('div');
    title.className = 'permTitle';
    title.appendChild(document.createTextNode(toolName || 'Permission'));
    card.appendChild(title);

    if (input) {
      var inputBox = document.createElement('div');
      inputBox.className = 'permInput';
      inputBox.appendChild(document.createTextNode(truncateJson(input, 400)));
      card.appendChild(inputBox);
    }

    var btnRow = document.createElement('div');
    btnRow.className = 'permBtns';

    var allowBtn = document.createElement('button');
    allowBtn.className = 'permBtn allow';
    allowBtn.appendChild(document.createTextNode('Allow'));

    var denyBtn = document.createElement('button');
    denyBtn.className = 'permBtn deny';
    denyBtn.appendChild(document.createTextNode('Deny'));

    var respond = function (allow) {
      allowBtn.disabled = true;
      denyBtn.disabled = true;
      if (state.wsSend) {
        state.wsSend({ type: 'chat.permission-response', requestId: requestId, allow: allow });
      }
      card.removeChild(btnRow);
      var status = document.createElement('div');
      status.className = 'permStatus';
      status.appendChild(document.createTextNode(allow ? 'Allowed' : 'Denied'));
      card.appendChild(status);
    };

    allowBtn.onclick = function () { respond(true); };
    denyBtn.onclick = function () { respond(false); };

    btnRow.appendChild(allowBtn);
    btnRow.appendChild(denyBtn);
    card.appendChild(btnRow);

    $('chatList').appendChild(card);
    scrollChatToBottom();
  }

  function handleWsFrame(data) {
    if (!data || typeof data !== 'object') { return; }
    var kind = data.kind || data.type;
    var frameSessionId = data.sessionId || (data.session && data.session.sessionId);
    if (frameSessionId && state.currentSessionId && frameSessionId !== state.currentSessionId) { return; }

    if (kind === 'chat_subscribed') {
      var pending = data.pendingPermissions;
      if (pending && Array.isArray(pending)) {
        for (var pi = 0; pi < pending.length; pi++) {
          var p = pending[pi];
          if (p && p.requestId) {
            renderPermissionCard(p.requestId, p.toolName, p.input);
          }
        }
      }
      return;
    }

    if (kind === 'permission_request' || kind === 'permission' || kind === 'chat.permission-request') {
      if (data.requestId) {
        renderPermissionCard(data.requestId, data.toolName, data.input);
      }
      return;
    }

    if (kind === 'complete' || kind === 'error' || kind === 'stream_end' || kind === 'protocol_error') {
      hideTyping();
      setThinking(false);
      if (kind === 'error' || kind === 'protocol_error') {
        setErr(data.error || data.message || 'Chat protocol error');
      }
      scrollChatToBottom();
    }

    if (kind && DROP_KINDS.hasOwnProperty(kind)) { return; }

    if (kind === 'stream_delta') {
      var deltaText = data.displayText;
      if (typeof deltaText !== 'string') {
        if (typeof data.content === 'string') {
          deltaText = data.content;
        } else {
          return;
        }
      }
      if (!deltaText.length || isJsonDump(deltaText)) { return; }
      if (!state.thinking) { setThinking(true); }
      if (state.lastAssistantEl) {
        if (deltaText.indexOf(state.streamingText) === 0 && deltaText.length >= state.streamingText.length) {
          state.streamingText = deltaText;
        } else {
          state.streamingText += deltaText;
        }
        var bodyEl = null;
        var kids = state.lastAssistantEl.childNodes;
        for (var bi = 0; bi < kids.length; bi++) {
          if (kids[bi].className === 'msgBody') {
            bodyEl = kids[bi];
            break;
          }
        }
        if (bodyEl) {
          bodyEl.innerHTML = renderMarkdown(state.streamingText);
        } else {
          state.lastAssistantEl.innerHTML = renderMarkdown(state.streamingText);
        }
        state.lastAssistantEl._copyText = state.streamingText;
        keepTypingAtBottom();
      } else {
        renderMessage({ role: 'assistant', displayText: deltaText });
        state.streamingText = deltaText;
      }
      scrollChatToBottom();
      return;
    }

    var role = data.role;
    if (role !== 'user' && role !== 'assistant') { return; }
    renderMessage(data);
    scrollChatToBottom();
  }

  function buildSessionSendOptions(sessionId) {
    var existing = state.sessionOptions[sessionId] || {};
    var options = {};
    for (var key in existing) {
      if (Object.prototype.hasOwnProperty.call(existing, key)) {
        options[key] = existing[key];
      }
    }

    state.sessionOptions[sessionId] = options;
    return options;
  }

  function sendChat() {
    var text = $('chatInput').value;
    if (!text) { return; }
    if (!state.wsSend || !state.wsConnected) { setErr('Chat is offline. Reconnecting…'); scheduleWsReconnect(); return; }
    if (state.thinking) { return; }
    var frame = { type: 'chat.send', sessionId: state.currentSessionId, content: text };
    frame.options = buildSessionSendOptions(state.currentSessionId);
    if (!state.wsSend(frame)) { setErr('Message was not sent because the connection closed.'); scheduleWsReconnect(); return; }
    hideTyping();
    renderMessage({ role: 'user', kind: 'text', displayText: text, timestamp: new Date().toISOString() });
    showTyping();
    setThinking(true);
    scrollChatToBottom();
    $('chatInput').value = '';
    saveDraft(state.currentSessionId, '');
  }

  function stopChat() {
    if (!state.wsSend) { return; }
    state.wsSend({ type: 'chat.abort', sessionId: state.currentSessionId });
    hideTyping();
    setThinking(false);
  }

  // ---- Voice input (feature-detect only; hide if unsupported) ----

  function getSpeechRecognitionCtor() {
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
  }

  function setupVoiceInput() {
    var btn = $('btnMic');
    if (!btn) { return; }
    var Ctor = getSpeechRecognitionCtor();
    if (!Ctor) {
      btn.style.display = 'none';
      return;
    }
    var rec = null;
    try {
      rec = new Ctor();
    } catch (e) {
      btn.style.display = 'none';
      return;
    }
    btn.style.display = 'block';
    rec.continuous = false;
    rec.interimResults = false;
    try {
      rec.lang = (navigator.language || 'en-US');
    } catch (e2) {}
    rec.onresult = function (event) {
      var transcript = '';
      if (event && event.results) {
        for (var i = event.resultIndex || 0; i < event.results.length; i++) {
          var res = event.results[i];
          if (res && res[0] && res[0].transcript) {
            transcript += res[0].transcript;
          }
        }
      }
      if (transcript) {
        var input = $('chatInput');
        var cur = input.value || '';
        if (cur && cur.charAt(cur.length - 1) !== ' ') {
          cur += ' ';
        }
        input.value = cur + transcript;
      }
    };
    rec.onend = function () {
      state.speechListening = false;
      btn.className = btn.className.replace(/\s*listening\b/g, '');
    };
    rec.onerror = function () {
      state.speechListening = false;
      btn.className = btn.className.replace(/\s*listening\b/g, '');
    };
    state.speechRec = rec;
    btn.onclick = function () {
      if (!state.speechRec) { return; }
      if (state.speechListening) {
        try { state.speechRec.stop(); } catch (e3) {}
        state.speechListening = false;
        btn.className = btn.className.replace(/\s*listening\b/g, '');
        return;
      }
      try {
        state.speechRec.start();
        state.speechListening = true;
        if (btn.className.indexOf('listening') === -1) {
          btn.className += ' listening';
        }
      } catch (e4) {
        state.speechListening = false;
        btn.className = btn.className.replace(/\s*listening\b/g, '');
      }
    };
  }

  // ---- Git ----

  function setGitErr(msg) {
    var el = $('gitErr');
    if (el) { el.innerHTML = msg || ''; }
  }

  function openGit(projectId, name) {
    if (!projectId) { return; }
    state.currentProjectId = projectId;
    if (name) { state.currentProjectName = name; }
    state.gitSelectedFile = null;
    updateGitEntryButtons();
    $('gitTitle').innerHTML = escapeHtml((state.currentProjectName || 'Git') + ' · Git');
    $('gitDiff').style.display = 'none';
    $('gitDiff').innerHTML = '';
    $('gitCommitMsg').value = '';
    setGitErr('');
    showScreen('screenGit');
    updateHashAndNav('screenGit', {
      categoryId: state.currentCategoryId,
      categoryName: state.currentCategoryName,
      projectId: state.currentProjectId,
      projectName: state.currentProjectName
    });
    loadGitStatus();
    loadGitBranches();
  }

  function leaveGit() {
    if (state.currentProjectId) {
      openProject(state.currentProjectId, state.currentProjectName || findProjectName(state.currentProjectId));
    } else {
      navGoCategories();
    }
  }

  function collectGitFiles(status) {
    var files = [];
    var seen = {};
    function addAll(arr, badge) {
      if (!arr || !arr.length) { return; }
      for (var i = 0; i < arr.length; i++) {
        var f = arr[i];
        if (!f || seen[f]) { continue; }
        seen[f] = true;
        files.push({ path: f, badge: badge });
      }
    }
    addAll(status.staged, 'S');
    addAll(status.modified, 'M');
    addAll(status.added, 'A');
    addAll(status.deleted, 'D');
    addAll(status.untracked, '?');
    return files;
  }

  function loadGitStatus(onDone) {
    var projectId = state.currentProjectId;
    if (!projectId) {
      setGitErr('No project selected');
      if (onDone) { onDone(); }
      return;
    }
    xhr('GET', '/api/git/status?project=' + encodeURIComponent(projectId), null, authHeaders(), function (data) {
      if (!data || data.error) {
        var msg = (data && (data.details || data.error)) || 'Not a git repository';
        setGitErr(msg);
        state.gitBranch = '';
        $('gitCurrentBranch').innerHTML = 'Branch: —';
        $('gitFileList').innerHTML = '';
        $('gitDiff').style.display = 'none';
        if (onDone) { onDone(); }
        return;
      }
      setGitErr('');
      state.gitBranch = data.branch || '';
      $('gitCurrentBranch').innerHTML = 'Branch: ' + escapeHtml(state.gitBranch || '—');
      renderGitFiles(collectGitFiles(data));
      selectGitBranchOption(state.gitBranch);
      if (onDone) { onDone(); }
    }, function (data) {
      setGitErr((data && (data.details || data.error)) || 'Failed to load git status');
      state.gitBranch = '';
      $('gitCurrentBranch').innerHTML = 'Branch: —';
      $('gitFileList').innerHTML = '';
      if (onDone) { onDone(); }
    });
  }

  function selectGitBranchOption(branch) {
    var sel = $('gitBranchSelect');
    if (!sel || !branch) { return; }
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === branch) {
        sel.selectedIndex = i;
        return;
      }
    }
  }

  function renderGitFiles(files) {
    var el = $('gitFileList');
    el.innerHTML = '';
    if (!files || !files.length) {
      var empty = document.createElement('div');
      empty.style.padding = '12px';
      empty.style.color = '#999';
      empty.appendChild(document.createTextNode('No changed files'));
      el.appendChild(empty);
      return;
    }
    for (var i = 0; i < files.length; i++) {
      (function (file) {
        var row = document.createElement('div');
        row.className = 'row gitFileRow';

        var check = document.createElement('input');
        check.type = 'checkbox';
        check.setAttribute('data-file', file.path);
        check.checked = true;
        check.onclick = function (e) {
          if (e && e.stopPropagation) { e.stopPropagation(); }
        };

        var badgeClass = file.badge === '?' ? 'U' : file.badge;
        var badge = document.createElement('span');
        badge.className = 'gitBadge ' + badgeClass;
        badge.appendChild(document.createTextNode(file.badge));

        var main = document.createElement('div');
        main.className = 'rowMain';
        var name = document.createElement('div');
        name.className = 'gitFileName';
        name.appendChild(document.createTextNode(file.path));
        main.appendChild(badge);
        main.appendChild(name);

        row.appendChild(check);
        row.appendChild(main);
        row.onclick = function () {
          showGitDiff(file.path);
        };
        el.appendChild(row);
      })(files[i]);
    }
  }

  function gitDiffLineClass(line) {
    if (line.indexOf('+++') === 0 || line.indexOf('---') === 0 || line.indexOf('diff ') === 0 || line.indexOf('index ') === 0) {
      return 'diffMeta';
    }
    if (line.indexOf('@@') === 0) { return 'diffHunk'; }
    if (line.charAt(0) === '+') { return 'diffAdd'; }
    if (line.charAt(0) === '-') { return 'diffDel'; }
    return '';
  }

  function renderGitDiff(pre, diff) {
    pre.innerHTML = '';
    var lines = String(diff).split('\n');
    var i;
    var row;
    var cls;
    for (i = 0; i < lines.length; i++) {
      if (i === lines.length - 1 && lines[i] === '') { continue; }
      cls = gitDiffLineClass(lines[i]);
      row = document.createElement('span');
      row.className = 'diffLine' + (cls ? ' ' + cls : '');
      row.appendChild(document.createTextNode(lines[i].length ? lines[i] : ' '));
      pre.appendChild(row);
    }
  }

  function showGitDiff(filePath) {
    var projectId = state.currentProjectId;
    if (!projectId || !filePath) { return; }
    state.gitSelectedFile = filePath;
    var pre = $('gitDiff');
    pre.style.display = 'block';
    pre.innerHTML = 'Loading diff\u2026';
    xhr('GET', '/api/git/diff?project=' + encodeURIComponent(projectId) + '&file=' + encodeURIComponent(filePath), null, authHeaders(), function (data) {
      if (!data || data.error) {
        pre.innerHTML = escapeHtml((data && data.error) || 'Failed to load diff');
        return;
      }
      var diff = data.diff || '(no diff)';
      renderGitDiff(pre, diff);
    }, function (data) {
      pre.innerHTML = escapeHtml((data && data.error) || 'Failed to load diff');
    });
  }

  function loadGitBranches(onDone) {
    var projectId = state.currentProjectId;
    var sel = $('gitBranchSelect');
    if (!projectId) {
      sel.innerHTML = '';
      if (onDone) { onDone(); }
      return;
    }
    xhr('GET', '/api/git/branches?project=' + encodeURIComponent(projectId), null, authHeaders(), function (data) {
      sel.innerHTML = '';
      if (!data || data.error) {
        if (onDone) { onDone(); }
        return;
      }
      var branches = data.branches || data.localBranches || [];
      var current = state.gitBranch || '';
      for (var i = 0; i < branches.length; i++) {
        var opt = document.createElement('option');
        opt.value = branches[i];
        opt.innerHTML = escapeHtml(branches[i]);
        if (branches[i] === current) { opt.selected = true; }
        sel.appendChild(opt);
      }
      selectGitBranchOption(current);
      if (onDone) { onDone(); }
    }, function () {
      if (onDone) { onDone(); }
    });
  }

  function checkoutGitBranch() {
    var projectId = state.currentProjectId;
    var branch = $('gitBranchSelect').value;
    if (!projectId || !branch) {
      setGitErr('Select a branch');
      return;
    }
    setGitErr('');
    xhr('POST', '/api/git/checkout', { project: projectId, branch: branch }, authHeaders(), function () {
      loadGitStatus();
      loadGitBranches();
    }, function (data) {
      setGitErr((data && data.error) || 'Checkout failed');
    });
  }

  function getCheckedGitFiles() {
    var checks = $('gitFileList').getElementsByTagName('input');
    var files = [];
    for (var i = 0; i < checks.length; i++) {
      if (checks[i].type === 'checkbox' && checks[i].checked) {
        var f = checks[i].getAttribute('data-file');
        if (f) { files.push(f); }
      }
    }
    return files;
  }

  function commitGitFiles() {
    var projectId = state.currentProjectId;
    var message = $('gitCommitMsg').value;
    if (!message || !String(message).replace(/^\s+|\s+$/g, '').length) {
      setGitErr('Enter a commit message');
      return;
    }
    var files = getCheckedGitFiles();
    if (!files.length) {
      setGitErr('Select at least one file');
      return;
    }
    setGitErr('');
    var btn = $('btnGitCommit');
    btn.disabled = true;
    xhr('POST', '/api/git/commit', { project: projectId, message: message, files: files }, authHeaders(), function () {
      btn.disabled = false;
      $('gitCommitMsg').value = '';
      $('gitDiff').style.display = 'none';
      $('gitDiff').innerHTML = '';
      loadGitStatus();
    }, function (data) {
      btn.disabled = false;
      setGitErr((data && data.error) || 'Commit failed');
    });
  }

  function gitFilesAction(pathName) {
    var files = getCheckedGitFiles(); if (!files.length) { setGitErr('Select at least one file'); return; }
    xhr('POST', '/api/git/' + pathName, { project: state.currentProjectId, files: files }, authHeaders(), function () { loadGitStatus(); }, function (d) { setGitErr((d && d.error) || (pathName + ' failed')); });
  }
  function gitBranchAction(pathName, promptText, confirmText) {
    var branch = promptText ? window.prompt(promptText, $('gitBranchSelect').value || '') : $('gitBranchSelect').value;
    if (!branch) { return; } if (confirmText && !window.confirm(confirmText + ' ' + branch + '?')) { return; }
    xhr('POST', '/api/git/' + pathName, { project: state.currentProjectId, branch: branch }, authHeaders(), function () { loadGitBranches(); loadGitStatus(); }, function (d) { setGitErr((d && d.error) || (pathName + ' failed')); });
  }
  function gitRemoteAction(pathName) {
    if ((pathName === 'pull' || pathName === 'push') && !window.confirm(pathName.charAt(0).toUpperCase() + pathName.substring(1) + ' remote changes?')) { return; }
    xhr('POST', '/api/git/' + pathName, { project: state.currentProjectId }, authHeaders(), function (d) { window.alert((d && (d.output || d.message)) || (pathName + ' complete')); loadGitStatus(); }, function (d) { setGitErr((d && (d.details || d.error)) || (pathName + ' failed')); });
  }
  function showGitHistory() {
    xhr('GET', '/api/git/commits?project=' + encodeURIComponent(state.currentProjectId) + '&limit=20', null, authHeaders(), function (d) {
      var commits = (d && d.commits) || [], diff = $('gitDiff'); diff.innerHTML = ''; diff.style.display = 'block';
      for (var i = 0; i < commits.length; i++) { (function (c) { var line = document.createElement('button'); line.className = 'secondary'; line.style.margin = '4px 8px'; line.style.width = 'calc(100% - 16px)'; line.appendChild(document.createTextNode((c.hash || c.shortHash || '').substring(0, 8) + ' ' + (c.subject || c.message || ''))); line.onclick = function () { xhr('GET', '/api/git/commit-diff?project=' + encodeURIComponent(state.currentProjectId) + '&commit=' + encodeURIComponent(c.hash || c.commit), null, authHeaders(), function (dd) { renderGitDiff($('gitDiff'), (dd && dd.diff) || ''); }); }; diff.appendChild(line); })(commits[i]); }
    }, function (d) { setGitErr((d && d.error) || 'History failed'); });
  }

  // ---- Action Centre (Mission Control API) ----

  function openReview() {
    showScreen('screenReview');
    updateHashAndNav('screenReview', {});
    loadReviewItems();
    if (state.reviewPollTimer) { clearInterval(state.reviewPollTimer); }
    state.reviewPollTimer = setInterval(loadReviewItems, 8000);
  }

  function leaveReview() {
    if (state.reviewPollTimer) {
      clearInterval(state.reviewPollTimer);
      state.reviewPollTimer = null;
    }
    navGoCategories();
  }

  function loadReviewItems(onDone) {
    var sections = [];
    var items = [];
    var remaining = 2;
    var loadError = '';

    function finished() {
      remaining -= 1;
      if (remaining > 0) { return; }
      renderReviewItems(sections, items, loadError);
      if (onDone) { onDone(); }
    }

    xhr('GET', '/api/mission-control/sections', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      sections = (payload && payload.sections) || [];
      finished();
    }, function () {
      loadError = 'Some Action Centre sections could not be loaded.';
      finished();
    });

    xhr('GET', '/api/mission-control/items?status=pending,failed', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      items = (payload && payload.items) || [];
      finished();
    }, function (data) {
      loadError = (data && data.error) || 'Failed to load Action Centre items.';
      finished();
    });
  }

  function actionNeedsConfirmation(action) {
    var text = String((action && action.id) || '') + ' ' + String((action && action.label) || '') + ' ' + String((action && action.kind) || '') + ' ' + String((action && action.style) || '');
    if (/draft[\s_-]*reply/i.test(text)) { return false; }
    return /(send|archive|mark[\s_-]*read|delete|destructive|remote)/i.test(text);
  }

  function setReviewButtonsDisabled(card, disabled) {
    var buttons = card.getElementsByTagName('button');
    for (var i = 0; i < buttons.length; i++) { buttons[i].disabled = disabled; }
  }

  function setReviewFeedback(card, message, className) {
    var nodes = card.getElementsByClassName('reviewFeedback');
    if (!nodes.length) { return; }
    nodes[0].className = 'reviewFeedback' + (className ? ' ' + className : '');
    nodes[0].innerHTML = '';
    nodes[0].appendChild(document.createTextNode(message));
  }

  function performReviewAction(itemId, action, card) {
    var label = action.label || action.id || 'action';
    if (actionNeedsConfirmation(action) && !window.confirm('Confirm "' + label + '"? This may change the connected service.')) {
      setReviewFeedback(card, 'Action cancelled.', '');
      return;
    }
    setReviewButtonsDisabled(card, true);
    card.setAttribute('aria-busy', 'true');
    setReviewFeedback(card, 'Working on ' + label + '\u2026', '');
    state.reviewActionStates[itemId] = { busy: true, message: 'Working on ' + label + '\u2026', className: '' };
    xhr('POST', '/api/mission-control/items/' + encodeURIComponent(itemId) + '/actions', { actionId: action.id }, authHeaders(), function () {
      card.setAttribute('aria-busy', 'false');
      setReviewFeedback(card, 'Completed: ' + label, 'success');
      state.reviewActionStates[itemId] = { busy: false, message: 'Completed: ' + label, className: 'success' };
      window.setTimeout(function () { delete state.reviewActionStates[itemId]; loadReviewItems(); }, 700);
    }, function (data) {
      var message = (data && data.error) || ('Could not complete ' + label + '.');
      card.setAttribute('aria-busy', 'false');
      setReviewButtonsDisabled(card, false);
      setReviewFeedback(card, message, 'error');
      state.reviewActionStates[itemId] = { busy: false, message: message, className: 'error' };
    });
  }

  function combinedActions(sectionActions, itemActions) {
    var result = [];
    var seen = {};
    var lists = [itemActions || [], sectionActions || []];
    for (var i = 0; i < lists.length; i++) {
      for (var j = 0; j < lists[i].length; j++) {
        var action = lists[i][j];
        var key = String(action.id || action.kind || action.label || '');
        if (key && !seen[key]) { seen[key] = true; result.push(action); }
      }
    }
    return result;
  }

  function renderReviewItems(sections, items, loadError) {
    var el = $('reviewList');
    el.innerHTML = '';
    if (loadError) {
      var errDiv = document.createElement('div');
      errDiv.className = 'reviewFeedback error';
      errDiv.setAttribute('role', 'alert');
      errDiv.appendChild(document.createTextNode(loadError));
      el.appendChild(errDiv);
    }
    if (!items || !items.length) {
      var empty = document.createElement('div');
      empty.style.padding = '12px';
      empty.style.color = '#999';
      empty.appendChild(document.createTextNode('No pending actions'));
      el.appendChild(empty);
      return;
    }

    var sectionMap = {};
    var groups = [];
    for (var s = 0; s < sections.length; s++) {
      sectionMap[sections[s].section_id] = sections[s];
      groups.push({ section: sections[s], items: [] });
    }
    for (var i = 0; i < items.length; i++) {
      var group = null;
      for (var g = 0; g < groups.length; g++) {
        if (groups[g].section.section_id === items[i].section_id) { group = groups[g]; break; }
      }
      if (!group) {
        group = { section: { section_id: items[i].section_id, title: 'Other actions', actions: [] }, items: [] };
        groups.push(group);
      }
      group.items.push(items[i]);
    }

    for (var groupIndex = 0; groupIndex < groups.length; groupIndex++) {
      if (!groups[groupIndex].items.length) { continue; }
      var groupEl = document.createElement('section');
      groupEl.className = 'reviewSection';
      var sectionTitle = document.createElement('div');
      sectionTitle.className = 'reviewSectionTitle';
      sectionTitle.appendChild(document.createTextNode((groups[groupIndex].section.icon ? groups[groupIndex].section.icon + ' ' : '') + (groups[groupIndex].section.title || 'Actions')));
      groupEl.appendChild(sectionTitle);
      for (var itemIndex = 0; itemIndex < groups[groupIndex].items.length; itemIndex++) {
        (function (item, section) {
        var card = document.createElement('div');
        card.className = 'reviewCard';

        var title = document.createElement('div');
        title.className = 'reviewTitle';
        title.appendChild(document.createTextNode(item.title || item.item_id || ''));
        card.appendChild(title);

        if (item.summary) {
          var summaryDiv = document.createElement('div');
          summaryDiv.className = 'reviewSummary';
          summaryDiv.appendChild(document.createTextNode(String(item.summary)));
          card.appendChild(summaryDiv);
        }

        if (item.status) {
          var statusDiv = document.createElement('div');
          statusDiv.className = 'reviewStatus';
          statusDiv.appendChild(document.createTextNode(String(item.status)));
          card.appendChild(statusDiv);
        }

        var feedback = document.createElement('div');
        feedback.className = 'reviewFeedback';
        feedback.setAttribute('role', 'status');
        feedback.setAttribute('aria-live', 'polite');
        card.appendChild(feedback);

        var actions = combinedActions(section.actions, item.actions);
        if (actions.length) {
          var btnRow = document.createElement('div');
          btnRow.className = 'reviewBtns';
          for (var j = 0; j < actions.length; j++) {
            (function (action) {
              var btn = document.createElement('button');
              var label = action.label || action.id || '';
              btn.className = action.style === 'primary' ? 'small' : 'secondary small';
              if (action.style === 'destructive') { btn.className = 'small destructive'; }
              btn.appendChild(document.createTextNode(label));
              btn.onclick = function () {
                performReviewAction(item.item_id, action, card);
              };
              btnRow.appendChild(btn);
            })(actions[j]);
          }
          card.appendChild(btnRow);
        }

        var actionState = state.reviewActionStates[item.item_id];
        if (actionState) {
          card.setAttribute('aria-busy', actionState.busy ? 'true' : 'false');
          setReviewFeedback(card, actionState.message, actionState.className);
          setReviewButtonsDisabled(card, actionState.busy);
        }

        groupEl.appendChild(card);
        })(groups[groupIndex].items[itemIndex], groups[groupIndex].section);
      }
      el.appendChild(groupEl);
    }
  }

  // ---- Logout ----

  function confirmLogout() {
    var sheet = $('logoutConfirm');
    if (sheet) { sheet.className = 'open'; }
  }

  function closeLogoutConfirm() {
    var sheet = $('logoutConfirm');
    if (sheet) { sheet.className = ''; }
  }

  function logout() {
    closeLogoutConfirm();
    state.token = null;
    state.currentCategoryId = null;
    state.currentProjectId = null;
    state.currentSessionId = null;
    if (state.ws) {
      try { state.ws.close(); } catch (e) {}
      state.ws = null;
    }
    if (state.reviewPollTimer) {
      clearInterval(state.reviewPollTimer);
      state.reviewPollTimer = null;
    }
    state.reviewActionStates = {};
    try {
      window.localStorage.removeItem(TOKEN_KEY);
    } catch (e) {}
    showScreen('screenLogin');
  }

  // ---- Wire up ----

  $('btnLogin').onclick = doLogin;
  $('btnThemeLogin').onclick = toggleTheme;
  $('btnThemeCategories').onclick = toggleTheme;
  $('btnThemeProjects').onclick = toggleTheme;
  $('btnThemeSessions').onclick = toggleTheme;
  $('btnThemeChat').onclick = toggleTheme;
  $('btnThemeReview').onclick = toggleTheme;
  $('btnThemeGit').onclick = toggleTheme;
  $('btnThemePickerClose').onclick = closeThemePicker;
  $('themeChoiceFog').onclick = function () { chooseTheme('fog'); };
  $('themeChoicePaper').onclick = function () { chooseTheme('paper'); };
  $('themeChoiceDusk').onclick = function () { chooseTheme('dusk'); };
  $('themeChoiceInk').onclick = function () { chooseTheme('ink'); };
  $('typeSizeSm').onclick = function () { chooseFont('sm'); };
  $('typeSizeMd').onclick = function () { chooseFont('md'); };
  $('typeSizeLg').onclick = function () { chooseFont('lg'); };
  $('themePicker').onclick = function (evt) {
    if (evt && evt.target && evt.target.id === 'themePicker') { closeThemePicker(); }
  };
  $('providerSelect').onchange = onProviderChange;
  $('modelSelect').onchange = function () { renderEffortOptions(); };
  $('permissionModeSelect').onchange = function () {
    persistSessionPermissionMode($('permissionModeSelect').value);
  };
  $('btnLogoutCategories').onclick = confirmLogout;
  $('btnLogoutCancel').onclick = closeLogoutConfirm;
  $('btnLogoutConfirm').onclick = logout;
  $('logoutConfirm').onclick = function (evt) {
    if (evt && evt.target && evt.target.id === 'logoutConfirm') { closeLogoutConfirm(); }
  };
  $('btnBackToCategories').onclick = function () { navGoCategories(); };
  $('btnBackToProjects').onclick = function () {
    openCategory(state.currentCategoryId, state.currentCategoryName || 'Projects');
  };
  $('btnBackToSessions').onclick = function () {
    saveCurrentDraft();
    if (state.ws) {
      try { state.ws.close(); } catch (e) {}
      state.ws = null;
    }
    hideTyping();
    setThinking(false);
    showScreen('screenSessions');
    updateHashAndNav('screenSessions', {
      categoryId: state.currentCategoryId,
      categoryName: state.currentCategoryName,
      projectId: state.currentProjectId,
      projectName: state.currentProjectName
    });
  };
  $('btnNewSession').onclick = onNewSessionClick;
  $('btnCancelNewSession').onclick = function () { setSessionSetupOpen(false); };
  $('btnLoadMoreSessions').onclick = function () { loadSessions(null, true); };
  $('btnArchivedSessions').onclick = loadArchivedSessions;
  $('btnSend').onclick = sendChat;
  $('btnStopChat').onclick = stopChat;
  $('btnLatest').onclick = function () { scrollChatToBottom(); };
  $('btnReviewFromCategories').onclick = function () { openReview(); };
  $('btnRefreshReview').onclick = function () { loadReviewItems(); };
  $('btnBackFromReview').onclick = leaveReview;
  $('btnGitFromProjects').onclick = function () {
    if (!state.currentProjectId) { return; }
    openGit(state.currentProjectId, state.currentProjectName);
  };
  $('btnGitFromSessions').onclick = function () {
    if (!state.currentProjectId) { return; }
    openGit(state.currentProjectId, state.currentProjectName);
  };
  $('btnBackFromGit').onclick = leaveGit;
  $('btnRefreshGit').onclick = function () {
    loadGitStatus();
    loadGitBranches();
  };
  $('btnGitCheckout').onclick = checkoutGitBranch;
  $('btnGitCommit').onclick = commitGitFiles;
  $('btnGitNewBranch').onclick = function () { gitBranchAction('create-branch', 'New branch name'); };
  $('btnGitDeleteBranch').onclick = function () { gitBranchAction('delete-branch', null, 'Delete branch'); };
  $('btnGitStage').onclick = function () { gitFilesAction('stage'); };
  $('btnGitUnstage').onclick = function () { gitFilesAction('unstage'); };
  $('btnGitHistory').onclick = showGitHistory;
  $('btnGitFetch').onclick = function () { gitRemoteAction('fetch'); };
  $('btnGitPull').onclick = function () { gitRemoteAction('pull'); };
  $('btnGitPush').onclick = function () { gitRemoteAction('push'); };

  setupVoiceInput();
  updateGitEntryButtons();
  (function initTheme() {
    var stored = getStoredItem(THEME_KEY);
    var name = normalizeTheme(stored);
    if (stored !== name) { setStoredItem(THEME_KEY, name); }
    applyTheme(name);
  })();
  (function initFont() {
    var stored = getStoredItem(FONT_KEY);
    var name = normalizeFont(stored);
    if (stored !== name) { setStoredItem(FONT_KEY, name); }
    applyTheme(getStoredItem(THEME_KEY));
  })();
  $('chatInput').onkeyup = function () { saveCurrentDraft(); };
  $('chatInput').onblur = function () { saveCurrentDraft(); };

  window.addEventListener('hashchange', function () {
    if (state.suppressHashChange) {
      state.suppressHashChange = false;
      return;
    }
    if (!state.token) { return; }
    applyRouteFromHash();
  }, false);

  window.addEventListener('online', function () {
    if (state.activeScreen === 'screenChat' && !state.wsConnected) { connectWs(true); }
  }, false);
  window.addEventListener('offline', function () {
    setConnectionStatus('Offline', 'offline');
  }, false);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.activeScreen === 'screenChat' && !state.wsConnected) { connectWs(true); }
  }, false);

  // ---- Pull to refresh ----

  var ptr = { active: false, startY: 0, dy: 0 };

  function isAtTop() {
    if (state.activeScreen === 'screenChat') {
      var cl = $('chatList');
      return cl.scrollTop === 0;
    }
    var doc = document.documentElement;
    var body = document.body;
    return (window.pageYOffset || 0) === 0 && (doc.scrollTop || 0) === 0 && (body.scrollTop || 0) === 0;
  }

  function showPtrBar() { $('ptrBar').style.display = 'block'; }
  function hidePtrBar() { $('ptrBar').style.display = 'none'; }

  function ptrRefreshCurrent() {
    var screen = state.activeScreen;
    var done = function () { hidePtrBar(); };
    if (screen === 'screenCategories') {
      loadCategories(false, done);
    } else if (screen === 'screenProjects') {
      reloadProjectsForRefresh(done);
    } else if (screen === 'screenSessions') {
      loadSessions(done);
    } else if (screen === 'screenReview') {
      loadReviewItems(done);
    } else if (screen === 'screenChat') {
      reloadMessagesForRefresh(done);
    } else if (screen === 'screenGit') {
      loadGitBranches();
      loadGitStatus(done);
    } else {
      hidePtrBar();
    }
  }

  document.addEventListener('touchstart', function (e) {
    if (state.activeScreen === 'screenLogin') { ptr.active = false; return; }
    if (!e.touches || e.touches.length !== 1) { ptr.active = false; return; }
    if (!isAtTop()) { ptr.active = false; return; }
    ptr.active = true;
    ptr.startY = e.touches[0].clientY;
    ptr.dy = 0;
  }, false);

  document.addEventListener('touchmove', function (e) {
    if (!ptr.active) { return; }
    if (!e.touches || e.touches.length !== 1) { return; }
    ptr.dy = e.touches[0].clientY - ptr.startY;
    if (ptr.dy > 0 && isAtTop()) {
      if (ptr.dy > 20) { showPtrBar(); }
    } else {
      ptr.active = false;
      hidePtrBar();
    }
  }, false);

  document.addEventListener('touchend', function () {
    if (!ptr.active) { return; }
    ptr.active = false;
    if (ptr.dy > 70) {
      ptrRefreshCurrent();
    } else {
      hidePtrBar();
    }
    ptr.dy = 0;
  }, false);

  // Try restoring existing token
  (function init() {
    var saved = null;
    try {
      saved = window.localStorage.getItem(TOKEN_KEY);
    } catch (e) {}
    if (saved) {
      state.token = saved;
      loadCategories(true);
    }
  })();

})();
</script>

</body>
</html>
