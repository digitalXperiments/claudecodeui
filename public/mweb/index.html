<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CloudCLI Lite</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #eee; font-family: Helvetica, Arial, sans-serif; }
  body.theme-light, body.theme-light html { background: #f4f4f4; color: #1a1a1a; }
  body.theme-light .screen { background: #f4f4f4; }
  body.theme-light h1 { color: #111; }
  body.theme-light label { color: #444; }
  body.theme-light input[type="text"], body.theme-light input[type="password"], body.theme-light select, body.theme-light textarea {
    background: #fff; color: #111; border: 1px solid #ccc;
  }
  body.theme-light button.secondary { background: #ddd; color: #111; }
  body.theme-light .row { border-bottom: 1px solid #ddd; }
  body.theme-light .row .meta { color: #666; }
  body.theme-light .topbar { background: #e8e8e8; border-bottom: 1px solid #ccc; }
  body.theme-light .topbar .title { color: #111; }
  body.theme-light #chatList { background: #f4f4f4; }
  body.theme-light .msg.assistant { background: #e2e2e2; color: #111; }
  body.theme-light .chatInputBar { background: #e8e8e8; border-top: 1px solid #ccc; }
  body.theme-light .list { border-top: 1px solid #ddd; }
  body { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; height: 100%; }
  .screen { display: none; padding: 12px; }
  .screen.active { display: block; }
  h1 { font-size: 18px; margin: 0 0 12px 0; color: #fff; }
  label { display: block; margin: 10px 0 4px 0; font-size: 14px; color: #ccc; }
  input[type="text"], input[type="password"], select, textarea {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    border-radius: 6px;
  }
  button {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin-top: 12px;
    background: #2a6df4;
    color: #fff;
    border: none;
    border-radius: 6px;
  }
  button.secondary { background: #333; }
  button.small { width: auto; display: inline-block; padding: 8px 14px; font-size: 14px; margin-top: 0; margin-right: 8px; }
  .row { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; padding: 14px 12px; border-bottom: 1px solid #333; }
  .row .meta { font-size: 12px; color: #999; }
  .row .swatch { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; display: inline-block; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .row .rowMain { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .topbar { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; padding: 10px 12px; background: #1a1a1a; border-bottom: 1px solid #333; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .topbar .title { font-size: 16px; font-weight: bold; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar button { width: auto; padding: 8px 12px; margin-top: 0; font-size: 13px; }
  #err { color: #ff6b6b; font-size: 13px; margin-top: 8px; min-height: 16px; }
  #chatList { padding: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto; min-height: 0; }
  .msg { margin-bottom: 10px; padding: 10px 12px; border-radius: 14px; max-width: 85%; word-wrap: break-word; white-space: pre-wrap; }
  .msg.user { background: #2a6df4; color: #fff; margin-left: auto; text-align: left; border-bottom-right-radius: 4px; }
  .msg.assistant { background: #2a2a2a; color: #eee; margin-right: auto; border-bottom-left-radius: 4px; }
  #screenChat.screen.active {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto;
    min-height: 0;
    height: 100%;
    padding: 0;
  }
  .chatInputBar { display: -webkit-box; display: -webkit-flex; display: flex; padding: 8px; border-top: 1px solid #333; background: #1a1a1a; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .chatInputBar textarea { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; resize: none; height: 44px; }
  .chatInputBar button { width: auto; margin-top: 0; margin-left: 8px; padding: 0 16px; }
  .list { border-top: 1px solid #333; }
</style>
</head>
<body>

<div id="screenLogin" class="screen active">
  <div class="topbar">
    <div class="title">CloudCLI Lite</div>
    <button class="secondary small" id="btnThemeLogin">Theme</button>
  </div>
  <div style="padding:12px;">
  <label>Username</label>
  <input type="text" id="loginUser" autocapitalize="off" autocorrect="off">
  <label>Password</label>
  <input type="password" id="loginPass">
  <div id="totpWrap" style="display:none;">
    <label>TOTP Code</label>
    <input type="text" id="loginTotp">
  </div>
  <button id="btnLogin">Log in</button>
  <div id="err"></div>
  </div>
</div>

<div id="screenCategories" class="screen">
  <div class="topbar">
    <div class="title">Projects</div>
    <div>
      <button class="secondary small" id="btnThemeCategories">Theme</button>
      <button class="secondary small" id="btnLogoutCategories">Logout</button>
    </div>
  </div>
  <div id="categoryList" class="list"></div>
</div>

<div id="screenProjects" class="screen">
  <div class="topbar">
    <div class="title" id="projectsTitle">Projects</div>
    <div>
      <button class="secondary small" id="btnThemeProjects">Theme</button>
      <button class="secondary small" id="btnBackToCategories">Back</button>
    </div>
  </div>
  <div id="projectList" class="list"></div>
</div>

<div id="screenSessions" class="screen">
  <div class="topbar">
    <div class="title" id="sessionsTitle">Sessions</div>
    <div>
      <button class="secondary small" id="btnThemeSessions">Theme</button>
      <button class="secondary small" id="btnBackToProjects">Back</button>
    </div>
  </div>
  <div style="padding:12px;">
    <label>Provider</label>
    <select id="providerSelect"></select>
    <label>Model</label>
    <select id="modelSelect"></select>
    <label>Effort</label>
    <select id="effortSelect"></select>
    <label>Permissions mode</label>
    <select id="permissionModeSelect"></select>
    <button id="btnNewSession">New session</button>
  </div>
  <div id="sessionList" class="list"></div>
</div>

<div id="screenChat" class="screen">
  <div class="topbar">
    <div class="title" id="chatTitle">Chat</div>
    <div>
      <button class="secondary small" id="btnThemeChat">Theme</button>
      <button class="secondary small" id="btnBackToSessions">Back</button>
    </div>
  </div>
  <div id="chatList"></div>
  <div class="chatInputBar">
    <textarea id="chatInput" placeholder="Message"></textarea>
    <button id="btnSend">Send</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'cloudcli_mweb_token';
  var THEME_KEY = 'cloudcli_mweb_theme';
  var PROVIDER_KEY = 'cloudcli_mweb_provider';
  var MODEL_KEY = 'cloudcli_mweb_model';
  var EFFORT_KEY = 'cloudcli_mweb_effort';
  var PERMISSION_KEY = 'cloudcli_mweb_permission_mode';
  var DROP_KINDS = {
    tool_use: true,
    tool_result: true,
    thinking: true,
    permission_request: true,
    permission_cancelled: true,
    session_created: true,
    interactive_prompt: true,
    task_notification: true,
    protocol_error: true,
    chat_subscribed: true,
    pong: true
  };

  var state = {
    token: null,
    categories: [],
    projects: [],
    currentCategoryId: null,
    currentProjectId: null,
    sessions: [],
    providers: [],
    capabilities: {},
    modelsByProvider: {},
    currentSessionId: null,
    sessionOptions: {},
    ws: null,
    lastAssistantEl: null
  };

  function $(id) { return document.getElementById(id); }

  function showScreen(id) {
    var screens = document.getElementsByClassName('screen');
    for (var i = 0; i < screens.length; i++) {
      screens[i].className = 'screen';
    }
    $(id).className = 'screen active';
  }

  function setErr(msg) {
    $('err').innerHTML = msg || '';
  }

  // ---- Theme ----

  function getStoredItem(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  function setStoredItem(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (e) {}
  }

  function applyTheme(theme) {
    if (theme === 'light') {
      document.body.className = 'theme-light';
    } else {
      document.body.className = '';
    }
  }

  function toggleTheme() {
    var current = getStoredItem(THEME_KEY) || 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    setStoredItem(THEME_KEY, next);
    applyTheme(next);
  }

  function xhr(method, url, body, headers, onSuccess, onError) {
    var req = new XMLHttpRequest();
    req.open(method, url, true);
    req.setRequestHeader('Content-Type', 'application/json');
    if (headers) {
      for (var k in headers) {
        if (headers.hasOwnProperty(k)) {
          req.setRequestHeader(k, headers[k]);
        }
      }
    }
    req.onreadystatechange = function () {
      if (req.readyState === 4) {
        var data = null;
        try {
          data = req.responseText ? JSON.parse(req.responseText) : null;
        } catch (e) {
          data = null;
        }
        if (req.status >= 200 && req.status < 300) {
          if (onSuccess) { onSuccess(data); }
        } else {
          if (onError) { onError(data, req.status); }
        }
      }
    };
    req.send(body ? JSON.stringify(body) : null);
  }

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + state.token };
  }

  function unwrap(data) {
    if (data && typeof data === 'object' && data.hasOwnProperty('data')) {
      return data.data;
    }
    return data;
  }

  // ---- Login ----

  function doLogin() {
    setErr('');
    var username = $('loginUser').value;
    var password = $('loginPass').value;
    var body = { username: username, password: password };
    if ($('totpWrap').style.display !== 'none') {
      body.totpCode = $('loginTotp').value;
    }
    xhr('POST', '/api/auth/login', body, null, function (data) {
      if (data && data.requiresTotp) {
        $('totpWrap').style.display = 'block';
        setErr('Enter your TOTP code');
        return;
      }
      if (data && data.success && data.token) {
        state.token = data.token;
        try {
          window.localStorage.setItem(TOKEN_KEY, data.token);
        } catch (e) {}
        loadCategories();
      } else {
        setErr((data && data.error) || 'Login failed');
      }
    }, function (data) {
      setErr((data && data.error) || 'Login failed');
    });
  }

  // ---- Categories ----

  function loadCategories() {
    xhr('GET', '/api/categories', null, authHeaders(), function (data) {
      var categories = (data && data.success && data.categories) || [];
      state.categories = categories;
      xhr('GET', '/api/projects', null, authHeaders(), function (projData) {
        var projects = Array.isArray(projData) ? projData : [];
        state.projects = projects;
        renderCategories();
        showScreen('screenCategories');
      }, function (projData) {
        setErr((projData && projData.error) || 'Failed to load projects');
      });
    }, function (data) {
      setErr((data && data.error) || 'Failed to load categories');
    });
  }

  function projectsForCategory(categoryId) {
    var out = [];
    for (var i = 0; i < state.projects.length; i++) {
      var p = state.projects[i];
      var pcid = p.categoryId || null;
      if (categoryId === null) {
        if (!pcid) { out.push(p); }
      } else if (pcid === categoryId) {
        out.push(p);
      }
    }
    return out;
  }

  function renderCategories() {
    var el = $('categoryList');
    el.innerHTML = '';
    var cats = state.categories.slice();
    cats.sort(function (a, b) {
      var sa = (typeof a.sortOrder === 'number') ? a.sortOrder : 0;
      var sb = (typeof b.sortOrder === 'number') ? b.sortOrder : 0;
      return sa - sb;
    });
    for (var i = 0; i < cats.length; i++) {
      (function (c) {
        var count = projectsForCategory(c.categoryId).length;
        var row = document.createElement('div');
        row.className = 'row';
        var swatch = '<span class="swatch" style="background:' + escapeHtml(c.color || '#666') + ';"></span>';
        row.innerHTML = '<div class="rowMain">' + swatch + '<div>' + escapeHtml(c.name || c.categoryId) + '</div></div><div class="meta">' + count + '</div>';
        row.onclick = function () {
          openCategory(c.categoryId, c.name || c.categoryId);
        };
        el.appendChild(row);
      })(cats[i]);
    }
    var uncategorized = projectsForCategory(null);
    if (uncategorized.length) {
      var urow = document.createElement('div');
      urow.className = 'row';
      urow.innerHTML = '<div class="rowMain"><span class="swatch" style="background:#555;"></span><div>Uncategorized</div></div><div class="meta">' + uncategorized.length + '</div>';
      urow.onclick = function () {
        openCategory(null, 'Uncategorized');
      };
      el.appendChild(urow);
    }
  }

  function openCategory(categoryId, name) {
    state.currentCategoryId = categoryId;
    $('projectsTitle').innerHTML = escapeHtml(name);
    renderProjects();
    showScreen('screenProjects');
  }

  // ---- Projects ----

  function renderProjects() {
    var el = $('projectList');
    el.innerHTML = '';
    var projects = projectsForCategory(state.currentCategoryId);
    for (var i = 0; i < projects.length; i++) {
      (function (p) {
        var row = document.createElement('div');
        row.className = 'row';
        var name = p.displayName || p.projectId;
        var pathStr = p.fullPath || p.path || '';
        row.innerHTML = '<div><div>' + escapeHtml(name) + '</div><div class="meta">' + escapeHtml(pathStr) + '</div></div>';
        row.onclick = function () {
          state.currentProjectId = p.projectId;
          $('sessionsTitle').innerHTML = escapeHtml(name);
          loadProviders();
          loadSessions();
        };
        el.appendChild(row);
      })(projects[i]);
    }
  }

  function escapeHtml(s) {
    if (!s) { return ''; }
    s = String(s);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function formatLastActivity(value) {
    if (!value) { return ''; }
    var d = new Date(value);
    if (isNaN(d.getTime())) { return String(value); }
    return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function sessionTitle(s) {
    if (s.summary && String(s.summary).length) {
      return s.summary;
    }
    if (s.name && String(s.name).length) {
      return s.name;
    }
    if (s.title && String(s.title).length) {
      return s.title;
    }
    var when = formatLastActivity(s.lastActivity);
    return when ? ('Chat ' + when) : 'Chat';
  }

  // ---- Providers ----

  function loadProviders() {
    xhr('GET', '/api/providers/capabilities', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var providers = (payload && payload.providers) || [];
      state.providers = providers;
      state.capabilities = {};
      for (var i = 0; i < providers.length; i++) {
        state.capabilities[providers[i].provider] = providers[i];
      }
      var sel = $('providerSelect');
      sel.innerHTML = '';
      var savedProvider = getStoredItem(PROVIDER_KEY);
      var haveSaved = false;
      for (var j = 0; j < providers.length; j++) {
        var opt = document.createElement('option');
        opt.value = providers[j].provider;
        opt.innerHTML = escapeHtml(providers[j].provider);
        sel.appendChild(opt);
        if (providers[j].provider === savedProvider) { haveSaved = true; }
      }
      if (haveSaved) { sel.value = savedProvider; }
      onProviderChange();
    }, function () {});
  }

  function currentCapabilities() {
    var provider = $('providerSelect').value;
    return state.capabilities[provider] || null;
  }

  function onProviderChange() {
    var provider = $('providerSelect').value;
    setStoredItem(PROVIDER_KEY, provider);
    loadModelsForProvider(provider);
    renderPermissionModeOptions();
  }

  function loadModelsForProvider(provider) {
    var modelSel = $('modelSelect');
    modelSel.innerHTML = '';
    if (!provider) { return; }
    if (state.modelsByProvider[provider]) {
      renderModelOptions(state.modelsByProvider[provider]);
      return;
    }
    xhr('GET', '/api/providers/' + encodeURIComponent(provider) + '/models', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var models = (payload && payload.models) || null;
      state.modelsByProvider[provider] = models;
      if (provider === $('providerSelect').value) {
        renderModelOptions(models);
      }
    }, function () {});
  }

  function renderModelOptions(models) {
    var modelSel = $('modelSelect');
    modelSel.innerHTML = '';
    var options = (models && models.OPTIONS) || [];
    var savedModel = getStoredItem(MODEL_KEY);
    var haveSaved = false;
    for (var i = 0; i < options.length; i++) {
      var opt = document.createElement('option');
      opt.value = options[i].value;
      opt.innerHTML = escapeHtml(options[i].label || options[i].value);
      modelSel.appendChild(opt);
      if (options[i].value === savedModel) { haveSaved = true; }
    }
    if (haveSaved) {
      modelSel.value = savedModel;
    } else if (models && models.DEFAULT) {
      modelSel.value = models.DEFAULT;
    }
    renderEffortOptions(options);
  }

  function currentModelOption(options) {
    var modelSel = $('modelSelect');
    for (var i = 0; i < options.length; i++) {
      if (options[i].value === modelSel.value) { return options[i]; }
    }
    return null;
  }

  function renderEffortOptions(options) {
    var effortSel = $('effortSelect');
    effortSel.innerHTML = '';
    var caps = currentCapabilities();
    if (!caps || !caps.supportsEffort) {
      effortSel.style.display = 'none';
      effortSel.previousElementSibling.style.display = 'none';
      return;
    }
    var modelOpt = currentModelOption(options || (state.modelsByProvider[$('providerSelect').value] || {}).OPTIONS || []);
    var values = (modelOpt && modelOpt.effort && modelOpt.effort.values) || [];
    if (!values.length) {
      effortSel.style.display = 'none';
      effortSel.previousElementSibling.style.display = 'none';
      return;
    }
    effortSel.style.display = '';
    effortSel.previousElementSibling.style.display = '';
    var savedEffort = getStoredItem(EFFORT_KEY);
    var haveSaved = false;
    for (var i = 0; i < values.length; i++) {
      var opt = document.createElement('option');
      opt.value = values[i].value;
      opt.innerHTML = escapeHtml(values[i].value);
      effortSel.appendChild(opt);
      if (values[i].value === savedEffort) { haveSaved = true; }
    }
    var def = (modelOpt && modelOpt.effort && modelOpt.effort.default) || '';
    if (haveSaved) {
      effortSel.value = savedEffort;
    } else if (def) {
      effortSel.value = def;
    }
  }

  function renderPermissionModeOptions() {
    var permSel = $('permissionModeSelect');
    permSel.innerHTML = '';
    var caps = currentCapabilities();
    var modes = (caps && caps.permissionModes) || [];
    var savedMode = getStoredItem(PERMISSION_KEY);
    var haveSaved = false;
    for (var i = 0; i < modes.length; i++) {
      var opt = document.createElement('option');
      opt.value = modes[i];
      opt.innerHTML = escapeHtml(modes[i]);
      permSel.appendChild(opt);
      if (modes[i] === savedMode) { haveSaved = true; }
    }
    if (haveSaved) {
      permSel.value = savedMode;
    } else if (caps && caps.defaultPermissionMode) {
      permSel.value = caps.defaultPermissionMode;
    }
  }

  // ---- Sessions ----

  function loadSessions() {
    xhr('GET', '/api/projects/' + encodeURIComponent(state.currentProjectId) + '/sessions', null, authHeaders(), function (data) {
      var list = [];
      if (data && Array.isArray(data.sessions)) {
        list = data.sessions;
      } else if (Array.isArray(data)) {
        list = data;
      }
      state.sessions = list;
      renderSessions();
      showScreen('screenSessions');
    }, function (data) {
      setErr((data && data.error) || 'Failed to load sessions');
    });
  }

  function renderSessions() {
    var el = $('sessionList');
    el.innerHTML = '';
    var sessions = state.sessions;
    if (!sessions || !Array.isArray(sessions)) {
      sessions = [];
    }
    for (var i = 0; i < sessions.length; i++) {
      (function (s) {
        var row = document.createElement('div');
        row.className = 'row';
        var sid = s.sessionId || s.id;
        var title = sessionTitle(s);
        row.innerHTML = '<div><div>' + escapeHtml(title) + '</div><div class="meta">' + escapeHtml(sid) + '</div></div>';
        row.onclick = function () {
          openChat(sid, title);
        };
        el.appendChild(row);
      })(sessions[i]);
    }
  }

  function newSession() {
    var provider = $('providerSelect').value;
    if (!provider) {
      setErr('No provider available');
      return;
    }
    var model = $('modelSelect').value || '';
    var effort = ($('effortSelect').style.display !== 'none') ? ($('effortSelect').value || '') : '';
    var permissionMode = $('permissionModeSelect').value || '';

    setStoredItem(PROVIDER_KEY, provider);
    if (model) { setStoredItem(MODEL_KEY, model); }
    if (effort) { setStoredItem(EFFORT_KEY, effort); }
    if (permissionMode) { setStoredItem(PERMISSION_KEY, permissionMode); }

    xhr('POST', '/api/providers/sessions', { provider: provider, projectId: state.currentProjectId }, authHeaders(), function (data) {
      var payload = unwrap(data);
      var sessionId = (payload && payload.sessionId) || (data && data.sessionId);
      if (sessionId) {
        var options = {};
        if (model) { options.model = model; }
        if (effort) { options.effort = effort; }
        if (permissionMode) { options.permissionMode = permissionMode; }
        state.sessionOptions[sessionId] = options;
        openChat(sessionId, 'Chat');
      } else {
        setErr('Failed to create session');
      }
    }, function (data) {
      setErr((data && data.error) || 'Failed to create session');
    });
  }

  // ---- Chat ----

  function openChat(sessionId, title) {
    state.currentSessionId = sessionId;
    state.lastAssistantEl = null;
    $('chatTitle').innerHTML = escapeHtml(title || 'Chat');
    $('chatList').innerHTML = '';
    showScreen('screenChat');
    loadMessages(sessionId);
    connectWs();
  }

  function loadMessages(sessionId) {
    xhr('GET', '/api/providers/sessions/' + encodeURIComponent(sessionId) + '/messages', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var messages = (payload && payload.messages) || [];
      for (var i = 0; i < messages.length; i++) {
        renderMessage(messages[i]);
      }
      scrollChatToBottom();
    }, function () {});
  }

  function isJsonDump(s) {
    if (typeof s !== 'string') { return true; }
    var trimmed = s.replace(/^\s+/, '');
    return trimmed.charAt(0) === '{';
  }

  function shouldRenderMessage(m) {
    if (!m) { return false; }
    if (m.kind === 'text') { return true; }
    var role = m.role;
    if (role !== 'user' && role !== 'assistant') { return false; }
    if (m.kind && DROP_KINDS.hasOwnProperty(m.kind)) { return false; }
    var text = m.displayText;
    if (typeof text !== 'string' && typeof m.content === 'string') {
      text = m.content;
    }
    if (typeof text !== 'string' || !text.length) { return false; }
    if (isJsonDump(text)) { return false; }
    return true;
  }

  function messageText(m) {
    if (typeof m.displayText === 'string') { return m.displayText; }
    if (typeof m.content === 'string') { return m.content; }
    return '';
  }

  function renderMessage(m) {
    if (!shouldRenderMessage(m)) { return; }
    var text = messageText(m);
    if (!text) { return; }
    var role = m.role;
    var div = document.createElement('div');
    var cls = role === 'user' ? 'msg user' : 'msg assistant';
    div.className = cls;
    div.innerHTML = escapeHtml(text);
    $('chatList').appendChild(div);
    if (role === 'assistant') {
      state.lastAssistantEl = div;
    } else {
      state.lastAssistantEl = null;
    }
  }

  function scrollChatToBottom() {
    var el = $('chatList');
    el.scrollTop = el.scrollHeight;
  }

  function wsUrl() {
    var proto = (window.location.protocol === 'https:') ? 'wss:' : 'ws:';
    return proto + '//' + window.location.host + '/ws?token=' + encodeURIComponent(state.token);
  }

  function connectWs() {
    if (state.ws) {
      try { state.ws.close(); } catch (e) {}
      state.ws = null;
    }
    var ws = new WebSocket(wsUrl());
    state.ws = ws;
    ws.onopen = function () {
      send({ type: 'chat.subscribe', sessions: [{ sessionId: state.currentSessionId }] });
    };
    ws.onmessage = function (evt) {
      var data = null;
      try {
        data = JSON.parse(evt.data);
      } catch (e) {
        return;
      }
      handleWsFrame(data);
    };
    ws.onclose = function () {};
    ws.onerror = function () {};

    function send(obj) {
      if (ws.readyState === 1) {
        ws.send(JSON.stringify(obj));
      }
    }
    state.wsSend = send;
  }

  function handleWsFrame(data) {
    if (!data || typeof data !== 'object') { return; }
    var kind = data.kind || data.type;

    if (kind === 'permission' || kind === 'chat.permission-request' || data.requestId) {
      if (data.requestId) {
        state.wsSend({ type: 'chat.permission-response', requestId: data.requestId, allow: false });
      }
      return;
    }

    if (kind && DROP_KINDS.hasOwnProperty(kind)) { return; }

    if (kind === 'stream_delta') {
      var deltaText = data.displayText;
      if (typeof deltaText !== 'string') {
        if (typeof data.content === 'string') {
          deltaText = data.content;
        } else {
          return;
        }
      }
      if (!deltaText.length || isJsonDump(deltaText)) { return; }
      if (state.lastAssistantEl) {
        state.lastAssistantEl.innerHTML = escapeHtml(deltaText);
      } else {
        renderMessage({ role: 'assistant', displayText: deltaText });
      }
      scrollChatToBottom();
      return;
    }

    var role = data.role;
    if (role !== 'user' && role !== 'assistant') { return; }
    renderMessage(data);
    scrollChatToBottom();
  }

  function sendChat() {
    var text = $('chatInput').value;
    if (!text) { return; }
    if (!state.wsSend) { return; }
    var frame = { type: 'chat.send', sessionId: state.currentSessionId, content: text };
    var options = state.sessionOptions[state.currentSessionId];
    if (options) {
      frame.options = options;
    }
    state.wsSend(frame);
    renderMessage({ role: 'user', kind: 'text', displayText: text });
    scrollChatToBottom();
    $('chatInput').value = '';
  }

  // ---- Logout ----

  function logout() {
    state.token = null;
    state.currentCategoryId = null;
    state.currentProjectId = null;
    state.currentSessionId = null;
    if (state.ws) {
      try { state.ws.close(); } catch (e) {}
      state.ws = null;
    }
    try {
      window.localStorage.removeItem(TOKEN_KEY);
    } catch (e) {}
    showScreen('screenLogin');
  }

  // ---- Wire up ----

  $('btnLogin').onclick = doLogin;
  $('btnThemeLogin').onclick = toggleTheme;
  $('btnThemeCategories').onclick = toggleTheme;
  $('btnThemeProjects').onclick = toggleTheme;
  $('btnThemeSessions').onclick = toggleTheme;
  $('btnThemeChat').onclick = toggleTheme;
  $('providerSelect').onchange = onProviderChange;
  $('modelSelect').onchange = function () { renderEffortOptions(); };
  $('btnLogoutCategories').onclick = logout;
  $('btnBackToCategories').onclick = function () { showScreen('screenCategories'); };
  $('btnBackToProjects').onclick = function () { showScreen('screenProjects'); };
  $('btnBackToSessions').onclick = function () {
    if (state.ws) {
      try { state.ws.close(); } catch (e) {}
      state.ws = null;
    }
    showScreen('screenSessions');
  };
  $('btnNewSession').onclick = newSession;
  $('btnSend').onclick = sendChat;

  applyTheme(getStoredItem(THEME_KEY) || 'dark');

  // Try restoring existing token
  (function init() {
    var saved = null;
    try {
      saved = window.localStorage.getItem(TOKEN_KEY);
    } catch (e) {}
    if (saved) {
      state.token = saved;
      loadCategories();
    }
  })();

})();
</script>

</body>
</html>
