<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CloudCLI Lite</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #eee; font-family: Helvetica, Arial, sans-serif; }
  body.theme-light, body.theme-light html { background: #f4f4f4; color: #1a1a1a; }
  body.theme-light .screen { background: #f4f4f4; }
  body.theme-light h1 { color: #111; }
  body.theme-light label { color: #444; }
  body.theme-light input[type="text"], body.theme-light input[type="password"], body.theme-light select, body.theme-light textarea {
    background: #fff; color: #111; border: 1px solid #ccc;
  }
  body.theme-light button.secondary { background: #ddd; color: #111; }
  body.theme-light .row { border-bottom: 1px solid #ddd; }
  body.theme-light .row .meta { color: #666; }
  body.theme-light .topbar { background: #e8e8e8; border-bottom: 1px solid #ccc; }
  body.theme-light .topbar .title { color: #111; }
  body.theme-light #chatList { background: #f4f4f4; }
  body.theme-light .msg.assistant { background: #e2e2e2; color: #111; }
  body.theme-light .chatInputBar { background: #e8e8e8; border-top: 1px solid #ccc; }
  body.theme-light .list { border-top: 1px solid #ddd; }
  body { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; height: 100%; }
  .screen { display: none; padding: 12px; }
  .screen.active { display: block; }
  h1 { font-size: 18px; margin: 0 0 12px 0; color: #fff; }
  label { display: block; margin: 10px 0 4px 0; font-size: 14px; color: #ccc; }
  input[type="text"], input[type="password"], select, textarea {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    border-radius: 6px;
  }
  button {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin-top: 12px;
    background: #2a6df4;
    color: #fff;
    border: none;
    border-radius: 6px;
  }
  button.secondary { background: #333; }
  button.small { width: auto; display: inline-block; padding: 8px 14px; font-size: 14px; margin-top: 0; margin-right: 8px; }
  .row { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; padding: 14px 12px; border-bottom: 1px solid #333; }
  .row .meta { font-size: 12px; color: #999; }
  .row .swatch { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; display: inline-block; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .row .rowMain { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  .topbar { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; padding: 10px 12px; background: #1a1a1a; border-bottom: 1px solid #333; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .topbar .title { font-size: 16px; font-weight: bold; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar button { width: auto; padding: 8px 12px; margin-top: 0; font-size: 13px; }
  #err { color: #ff6b6b; font-size: 13px; margin-top: 8px; min-height: 16px; }
  #chatList { padding: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto; min-height: 0; }
  .msg { margin-bottom: 10px; padding: 10px 12px; border-radius: 14px; max-width: 85%; word-wrap: break-word; overflow-wrap: break-word; }
  .msg.user { background: #2a6df4; color: #fff; margin-left: auto; text-align: left; border-bottom-right-radius: 4px; }
  .msg.assistant { background: #2a2a2a; color: #eee; margin-right: auto; border-bottom-left-radius: 4px; }
  .msg p { margin: 0 0 8px 0; }
  .msg p:last-child { margin-bottom: 0; }
  .msg h1, .msg h2, .msg h3 { margin: 10px 0 6px 0; line-height: 1.25; }
  .msg h1 { font-size: 18px; color: inherit; }
  .msg h2 { font-size: 16px; color: inherit; }
  .msg h3 { font-size: 15px; color: inherit; }
  .msg ul, .msg ol { margin: 0 0 8px 0; padding-left: 22px; }
  .msg li { margin-bottom: 4px; }
  .msg blockquote { margin: 0 0 8px 0; padding: 4px 10px; border-left: 3px solid #888; color: inherit; opacity: 0.85; }
  .msg blockquote p { margin: 0; }
  .msg pre { margin: 0 0 8px 0; padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,0.35); overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: pre; }
  .msg code { font-family: Menlo, Consolas, monospace; font-size: 14px; }
  .msg pre code { background: none; padding: 0; }
  .msg :not(pre) > code { background: rgba(0,0,0,0.25); padding: 1px 5px; border-radius: 4px; }
  .msg a { color: #8ab4ff; text-decoration: underline; word-break: break-word; }
  .msg.user a { color: #fff; }
  body.theme-light .msg pre { background: rgba(0,0,0,0.08); }
  body.theme-light .msg :not(pre) > code { background: rgba(0,0,0,0.08); }
  body.theme-light .msg blockquote { border-left-color: #999; }
  body.theme-light .msg a { color: #1a53d6; }
  body.theme-light .msg.user a { color: #fff; }
  .msg .md-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 0 8px 0; }
  .msg table.md-table { white-space: normal; border-collapse: collapse; width: 100%; font-size: 13px; }
  .msg table.md-table th, .msg table.md-table td { padding: 6px 8px; border: 1px solid #555; text-align: left; }
  .msg table.md-table th { font-weight: bold; }
  body.theme-light .msg table.md-table th, body.theme-light .msg table.md-table td { border-color: #ccc; }
  .msg.typing { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; color: #999; font-size: 13px; }
  .msg.typing .typingDots { display: inline-block; margin-right: 8px; }
  .msg.typing .typingDots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: #999; -webkit-animation: pulse 1.2s infinite ease-in-out; animation: pulse 1.2s infinite ease-in-out; }
  .msg.typing .typingDots span:nth-child(2) { -webkit-animation-delay: 0.2s; animation-delay: 0.2s; }
  .msg.typing .typingDots span:nth-child(3) { -webkit-animation-delay: 0.4s; animation-delay: 0.4s; }
  body.theme-light .msg.typing { color: #777; }
  body.theme-light .msg.typing .typingDots span { background: #777; }
  @-webkit-keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }
  #screenChat.screen.active {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto;
    min-height: 0;
    height: 100%;
    padding: 0;
  }
  .chatInputBar { display: -webkit-box; display: -webkit-flex; display: flex; padding: 8px; border-top: 1px solid #333; background: #1a1a1a; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .chatInputBar textarea { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; resize: none; height: 44px; }
  .chatInputBar button { width: auto; margin-top: 0; margin-left: 8px; padding: 0 16px; }
  .list { border-top: 1px solid #333; }
  .tabbar { display: -webkit-box; display: -webkit-flex; display: flex; border-top: 1px solid #333; background: #1a1a1a; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .tabbar .tabBtn { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; text-align: center; padding: 12px 0; font-size: 14px; color: #999; background: none; border: none; }
  .tabbar .tabBtn.active { color: #2a6df4; font-weight: bold; }
  body.theme-light .tabbar { background: #e8e8e8; border-top: 1px solid #ccc; }
  .permCard { margin-bottom: 10px; padding: 10px 12px; border-radius: 10px; background: #2a2a2a; border: 1px solid #444; max-width: 92%; }
  body.theme-light .permCard { background: #e2e2e2; border-color: #ccc; }
  .permCard .permTitle { font-weight: bold; margin-bottom: 6px; }
  .permCard .permInput { font-family: Menlo, Consolas, monospace; font-size: 12px; background: rgba(0,0,0,0.25); padding: 6px 8px; border-radius: 6px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
  body.theme-light .permCard .permInput { background: rgba(0,0,0,0.08); }
  .permCard .permBtns { display: -webkit-box; display: -webkit-flex; display: flex; }
  .permCard .permBtns button { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; margin-top: 0; margin-right: 8px; }
  .permCard .permBtns button:last-child { margin-right: 0; }
  .permCard .permBtn.allow { background: #2a6df4; }
  .permCard .permBtn.deny { background: #a33; }
  .permCard .permStatus { font-size: 13px; color: #999; text-align: center; }
  .jobRow .jobStatus { font-size: 12px; }
  #jobsList .row { -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; -webkit-box-align: stretch; -webkit-align-items: stretch; align-items: stretch; }
  #jobsList .row .jobTop { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
  #jobsList .row .jobSummary { font-size: 12px; color: #999; margin-top: 6px; }
  #jobsList .row button.small { margin-top: 8px; }
  #ptrBar { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999; text-align: center; padding: 8px 0; font-size: 12px; background: #2a6df4; color: #fff; }
</style>
</head>
<body>

<div id="ptrBar">Refreshing&hellip;</div>

<div id="screenLogin" class="screen active">
  <div class="topbar">
    <div class="title">CloudCLI Lite</div>
    <button class="secondary small" id="btnThemeLogin">Theme</button>
  </div>
  <div style="padding:12px;">
  <label>Username</label>
  <input type="text" id="loginUser" autocapitalize="off" autocorrect="off">
  <label>Password</label>
  <input type="password" id="loginPass">
  <div id="totpWrap" style="display:none;">
    <label>TOTP Code</label>
    <input type="text" id="loginTotp">
  </div>
  <button id="btnLogin">Log in</button>
  <div id="err"></div>
  </div>
</div>

<div id="screenCategories" class="screen">
  <div class="topbar">
    <div class="title">Projects</div>
    <div>
      <button class="secondary small" id="btnThemeCategories">Theme</button>
      <button class="secondary small" id="btnLogoutCategories">Logout</button>
    </div>
  </div>
  <div id="categoryList" class="list"></div>
  <div class="tabbar">
    <button class="tabBtn active" id="tabChatFromCategories">Chat</button>
    <button class="tabBtn" id="tabJobsFromCategories">Jobs</button>
  </div>
</div>

<div id="screenProjects" class="screen">
  <div class="topbar">
    <div class="title" id="projectsTitle">Projects</div>
    <div>
      <button class="secondary small" id="btnThemeProjects">Theme</button>
      <button class="secondary small" id="btnBackToCategories">Back</button>
    </div>
  </div>
  <div id="projectList" class="list"></div>
  <div class="tabbar">
    <button class="tabBtn active" id="tabChatFromProjects">Chat</button>
    <button class="tabBtn" id="tabJobsFromProjects">Jobs</button>
  </div>
</div>

<div id="screenSessions" class="screen">
  <div class="topbar">
    <div class="title" id="sessionsTitle">Sessions</div>
    <div>
      <button class="secondary small" id="btnThemeSessions">Theme</button>
      <button class="secondary small" id="btnBackToProjects">Back</button>
    </div>
  </div>
  <div style="padding:12px;">
    <label>Provider</label>
    <select id="providerSelect"></select>
    <label>Model</label>
    <select id="modelSelect"></select>
    <label>Effort</label>
    <select id="effortSelect"></select>
    <label>Permissions mode</label>
    <select id="permissionModeSelect"></select>
    <button id="btnNewSession">New session</button>
  </div>
  <div id="sessionList" class="list"></div>
  <div class="tabbar">
    <button class="tabBtn active" id="tabChatFromSessions">Chat</button>
    <button class="tabBtn" id="tabJobsFromSessions">Jobs</button>
  </div>
</div>

<div id="screenChat" class="screen">
  <div class="topbar">
    <div class="title" id="chatTitle">Chat</div>
    <div>
      <button class="secondary small" id="btnThemeChat">Theme</button>
      <button class="secondary small" id="btnStopChat">Stop</button>
      <button class="secondary small" id="btnJobsFromChat">Jobs</button>
      <button class="secondary small" id="btnBackToSessions">Back</button>
    </div>
  </div>
  <div id="chatList"></div>
  <div class="chatInputBar">
    <textarea id="chatInput" placeholder="Message"></textarea>
    <button id="btnSend">Send</button>
  </div>
</div>

<div id="screenJobs" class="screen">
  <div class="topbar">
    <div class="title">Jobs</div>
    <div>
      <button class="secondary small" id="btnThemeJobs">Theme</button>
      <button class="secondary small" id="btnRefreshJobs">Refresh</button>
      <button class="secondary small" id="btnBackFromJobs">Back</button>
    </div>
  </div>
  <div id="jobsList" class="list"></div>
</div>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'cloudcli_mweb_token';
  var THEME_KEY = 'cloudcli_mweb_theme';
  var PROVIDER_KEY = 'cloudcli_mweb_provider';
  var MODEL_KEY = 'cloudcli_mweb_model';
  var EFFORT_KEY = 'cloudcli_mweb_effort';
  var PERMISSION_KEY = 'cloudcli_mweb_permission_mode';
  var NAV_KEY = 'cloudcli_mweb_nav';
  var DROP_KINDS = {
    tool_use: true,
    tool_result: true,
    thinking: true,
    permission_cancelled: true,
    session_created: true,
    interactive_prompt: true,
    task_notification: true,
    protocol_error: true,
    chat_subscribed: true,
    pong: true
  };

  var state = {
    token: null,
    categories: [],
    projects: [],
    currentCategoryId: null,
    currentCategoryName: '',
    currentProjectId: null,
    currentProjectName: '',
    activeScreen: 'screenLogin',
    suppressHashChange: false,
    sessions: [],
    providers: [],
    capabilities: {},
    modelsByProvider: {},
    currentSessionId: null,
    sessionOptions: {},
    ws: null,
    lastAssistantEl: null,
    jobsPollTimer: null,
    jobsFromScreen: 'screenCategories'
  };

  function $(id) { return document.getElementById(id); }

  function showScreen(id) {
    var screens = document.getElementsByClassName('screen');
    for (var i = 0; i < screens.length; i++) {
      screens[i].className = 'screen';
    }
    $(id).className = 'screen active';
    state.activeScreen = id;
  }

  function setErr(msg) {
    $('err').innerHTML = msg || '';
  }

  // ---- Theme ----

  function getStoredItem(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  function setStoredItem(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (e) {}
  }

  function applyTheme(theme) {
    if (theme === 'light') {
      document.body.className = 'theme-light';
    } else {
      document.body.className = '';
    }
  }

  function toggleTheme() {
    var current = getStoredItem(THEME_KEY) || 'dark';
    var next = current === 'light' ? 'dark' : 'light';
    setStoredItem(THEME_KEY, next);
    applyTheme(next);
  }

  function xhr(method, url, body, headers, onSuccess, onError) {
    var req = new XMLHttpRequest();
    req.open(method, url, true);
    req.setRequestHeader('Content-Type', 'application/json');
    if (headers) {
      for (var k in headers) {
        if (headers.hasOwnProperty(k)) {
          req.setRequestHeader(k, headers[k]);
        }
      }
    }
    req.onreadystatechange = function () {
      if (req.readyState === 4) {
        var data = null;
        try {
          data = req.responseText ? JSON.parse(req.responseText) : null;
        } catch (e) {
          data = null;
        }
        if (req.status >= 200 && req.status < 300) {
          if (onSuccess) { onSuccess(data); }
        } else {
          if (onError) { onError(data, req.status); }
        }
      }
    };
    req.send(body ? JSON.stringify(body) : null);
  }

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + state.token };
  }

  function unwrap(data) {
    if (data && typeof data === 'object' && data.hasOwnProperty('data')) {
      return data.data;
    }
    return data;
  }

  // ---- Hash routing ----

  function saveNav(obj) {
    setStoredItem(NAV_KEY, JSON.stringify(obj));
  }

  function getNav() {
    var raw = getStoredItem(NAV_KEY);
    if (!raw) { return null; }
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function catToken(categoryId) {
    return (categoryId === null || categoryId === undefined || categoryId === '') ? 'uncat' : categoryId;
  }

  function buildHash(screen, params) {
    params = params || {};
    if (screen === 'screenCategories') { return '#/categories'; }
    if (screen === 'screenProjects') {
      return '#/projects/' + encodeURIComponent(catToken(params.categoryId));
    }
    if (screen === 'screenSessions') {
      return '#/sessions/' + encodeURIComponent(params.projectId || '');
    }
    if (screen === 'screenChat') {
      return '#/chat/' + encodeURIComponent(params.sessionId || '') +
        '?p=' + encodeURIComponent(params.projectId || '') +
        '&c=' + encodeURIComponent(catToken(params.categoryId));
    }
    if (screen === 'screenJobs') { return '#/jobs'; }
    return '#/categories';
  }

  function updateHashAndNav(screen, params) {
    params = params || {};
    var hash = buildHash(screen, params);
    if (window.location.hash !== hash) {
      state.suppressHashChange = true;
      window.location.hash = hash;
    }
    saveNav({
      screen: screen,
      categoryId: (params.categoryId !== undefined) ? params.categoryId : state.currentCategoryId,
      categoryName: (params.categoryName !== undefined) ? params.categoryName : state.currentCategoryName,
      projectId: (params.projectId !== undefined) ? params.projectId : state.currentProjectId,
      projectName: (params.projectName !== undefined) ? params.projectName : state.currentProjectName,
      sessionId: (params.sessionId !== undefined) ? params.sessionId : state.currentSessionId,
      title: params.title,
      jobsFromScreen: (params.jobsFromScreen !== undefined) ? params.jobsFromScreen : state.jobsFromScreen
    });
  }

  function parseHash() {
    var h = window.location.hash || '';
    if (h.charAt(0) === '#') { h = h.substring(1); }
    if (h.charAt(0) === '/') { h = h.substring(1); }
    var qIndex = h.indexOf('?');
    var query = '';
    if (qIndex !== -1) {
      query = h.substring(qIndex + 1);
      h = h.substring(0, qIndex);
    }
    var parts = h.split('/');
    var route = {
      name: parts[0] || '',
      id: (parts[1] !== undefined && parts[1] !== '') ? decodeURIComponent(parts[1]) : null,
      query: {}
    };
    if (query) {
      var pairs = query.split('&');
      for (var i = 0; i < pairs.length; i++) {
        var kv = pairs[i].split('=');
        if (kv[0]) { route.query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); }
      }
    }
    return route;
  }

  function findCategoryName(categoryId) {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].categoryId === categoryId) {
        return state.categories[i].name || categoryId;
      }
    }
    return categoryId || 'Category';
  }

  function findProjectName(projectId) {
    for (var i = 0; i < state.projects.length; i++) {
      if (state.projects[i].projectId === projectId) {
        return state.projects[i].displayName || projectId;
      }
    }
    return projectId || 'Project';
  }

  function navGoCategories() {
    renderCategories();
    showScreen('screenCategories');
    updateHashAndNav('screenCategories', {});
  }

  function applyRouteFromHash() {
    var route = parseHash();
    if (!route.name || route.name === 'categories') {
      navGoCategories();
      return;
    }
    if (route.name === 'projects') {
      var categoryId = (route.id === 'uncat' || route.id === null) ? null : route.id;
      var categoryName = (categoryId === null) ? 'Uncategorized' : findCategoryName(categoryId);
      openCategory(categoryId, categoryName);
      return;
    }
    if (route.name === 'sessions') {
      var projectId = route.id;
      if (!projectId) { navGoCategories(); return; }
      var nav = getNav();
      if (nav && nav.projectId === projectId) {
        state.currentCategoryId = (nav.categoryId === 'uncat') ? null : nav.categoryId;
        state.currentCategoryName = nav.categoryName || state.currentCategoryName;
      }
      openProject(projectId, findProjectName(projectId));
      return;
    }
    if (route.name === 'chat') {
      var sessionId = route.id;
      if (!sessionId) { navGoCategories(); return; }
      var pid = route.query.p;
      var cid = route.query.c;
      if (pid) {
        state.currentProjectId = pid;
        state.currentProjectName = findProjectName(pid);
      }
      if (cid !== undefined && cid !== '') {
        state.currentCategoryId = (cid === 'uncat') ? null : cid;
      }
      var navChat = getNav();
      var title = (navChat && navChat.title) || 'Chat';
      openChat(sessionId, title);
      return;
    }
    if (route.name === 'jobs') {
      var navJobs = getNav();
      openJobs((navJobs && navJobs.jobsFromScreen) || 'screenCategories');
      return;
    }
    navGoCategories();
  }

  // ---- Login ----

  function doLogin() {
    setErr('');
    var username = $('loginUser').value;
    var password = $('loginPass').value;
    var body = { username: username, password: password };
    if ($('totpWrap').style.display !== 'none') {
      body.totpCode = $('loginTotp').value;
    }
    xhr('POST', '/api/auth/login', body, null, function (data) {
      if (data && data.requiresTotp) {
        $('totpWrap').style.display = 'block';
        setErr('Enter your TOTP code');
        return;
      }

  function escapeHtml(s) {
    if (!s) { return ''; }
    s = String(s);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function escapeAttr(s) {
    return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function boldItalic(s) {
    s = s.replace(/(\*\*|__)([^\n]+?)\1/g, '<strong>$2</strong>');
    s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
    s = s.replace(/(^|[^A-Za-z0-9_])_([^_\n]+)_(?![A-Za-z0-9_])/g, '$1<em>$2</em>');
    return s;
  }

  function renderMarkdown(raw) {
    var text = escapeHtml(raw);
    var MARK = 'MDTOK' + Math.floor(Math.random() * 1e9) + 'X';

    var blocks = [];
    text = text.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, function (m, lang, code) {
      var idx = blocks.length;
      var c = code.replace(/\n$/, '');
      blocks.push('<pre><code>' + c + '</code></pre>');
      return MARK + 'B' + idx + 'E';
    });

    var inlineCode = [];
    text = text.replace(/`([^`\n]+)`/g, function (m, code) {
      var idx = inlineCode.length;
      inlineCode.push('<code>' + code + '</code>');
      return MARK + 'I' + idx + 'E';
    });

    var links = [];
    text = text.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, function (m, label, url) {
      var idx = links.length;
      var u = url.replace(/^\s+|\s+$/g, '');
      var html;
      if (/^(https?:|mailto:)/i.test(u)) {
        html = '<a href="' + escapeAttr(u) + '" target="_blank" rel="noopener noreferrer">' + boldItalic(label) + '</a>';
      } else {
        html = boldItalic(label);
      }
      links.push(html);
      return MARK + 'L' + idx + 'E';
    });

    var lines = text.split('\n');
    var out = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      var trimmed = line.replace(/^\s+|\s+$/g, '');
      if (trimmed === '') { i++; continue; }

      var blockMatch = trimmed.match(new RegExp('^' + MARK + 'B(\\d+)E$'));
      if (blockMatch) {
        out.push(blocks[Number(blockMatch[1])]);
        i++;
        continue;
      }

      var h = line.match(/^(#{1,3})\s+(.*)$/);
      if (h) {
        var level = h[1].length;
        out.push('<h' + level + '>' + boldItalic(h[2]) + '</h' + level + '>');
        i++;
        continue;
      }

      if (/^>\s?/.test(line)) {
        var qlines = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          qlines.push(boldItalic(lines[i].replace(/^>\s?/, '')));
          i++;
        }
        out.push('<blockquote><p>' + qlines.join('<br>') + '</p></blockquote>');
        continue;
      }

      var sepRe = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;
      if (line.indexOf('|') !== -1 && i + 1 < lines.length && sepRe.test(lines[i + 1])) {
        var splitRow = function (rowLine) {
          var cells = rowLine.replace(/^\s+|\s+$/g, '').replace(/^\|/, '').replace(/\|$/, '').split('|');
          var out2 = [];
          for (var ci = 0; ci < cells.length; ci++) {
            out2.push(boldItalic(cells[ci].replace(/^\s+|\s+$/g, '')));
          }
          return out2;
        };
        var headCells = splitRow(line);
        var theadHtml = '<tr>';
        for (var hc = 0; hc < headCells.length; hc++) {
          theadHtml += '<th>' + headCells[hc] + '</th>';
        }
        theadHtml += '</tr>';
        i += 2;
        var bodyRows = [];
        while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].replace(/^\s+|\s+$/g, '') !== '') {
          var rowCells = splitRow(lines[i]);
          var rowHtml = '<tr>';
          for (var rc = 0; rc < rowCells.length; rc++) {
            rowHtml += '<td>' + rowCells[rc] + '</td>';
          }
          rowHtml += '</tr>';
          bodyRows.push(rowHtml);
          i++;
        }
        out.push('<div class="md-table-wrap"><table class="md-table"><thead>' + theadHtml + '</thead><tbody>' + bodyRows.join('') + '</tbody></table></div>');
        continue;
      }

      if (/^[-*]\s+/.test(line)) {
        var ulItems = [];
        while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
          ulItems.push('<li>' + boldItalic(lines[i].replace(/^[-*]\s+/, '')) + '</li>');
          i++;
        }
        out.push('<ul>' + ulItems.join('') + '</ul>');
        continue;
      }

      if (/^\d+\.\s+/.test(line)) {
        var olItems = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
          olItems.push('<li>' + boldItalic(lines[i].replace(/^\d+\.\s+/, '')) + '</li>');
          i++;
        }
        out.push('<ol>' + olItems.join('') + '</ol>');
        continue;
      }

      var pLines = [];
      while (i < lines.length) {
        var t = lines[i].replace(/^\s+|\s+$/g, '');
        if (t === '') { break; }
        if (new RegExp('^' + MARK + 'B\\d+E$').test(t)) { break; }
        if (/^(#{1,3})\s+/.test(lines[i])) { break; }
        if (/^>\s?/.test(lines[i])) { break; }
        if (/^[-*]\s+/.test(lines[i])) { break; }
        if (/^\d+\.\s+/.test(lines[i])) { break; }
        pLines.push(boldItalic(lines[i]));
        i++;
      }
      out.push('<p>' + pLines.join('<br>') + '</p>');
    }

    var html = out.join('');
    html = html.replace(new RegExp(MARK + 'L(\\d+)E', 'g'), function (m, idx) { return links[Number(idx)]; });
    html = html.replace(new RegExp(MARK + 'I(\\d+)E', 'g'), function (m, idx) { return inlineCode[Number(idx)]; });
    return html;
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function formatLastActivity(value) {
    if (!value) { return ''; }
    var d = new Date(value);
    if (isNaN(d.getTime())) { return String(value); }
    return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function sessionTitle(s) {
    if (s.summary && String(s.summary).length) {
      return s.summary;
    }
    if (s.name && String(s.name).length) {
      return s.name;
    }
    if (s.title && String(s.title).length) {
      return s.title;
    }
    var when = formatLastActivity(s.lastActivity);
    return when ? ('Chat ' + when) : 'Chat';
  }

  // ---- Providers ----

  function loadProviders() {
    xhr('GET', '/api/providers/capabilities', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var providers = (payload && payload.providers) || [];
      state.providers = providers;
      state.capabilities = {};
      for (var i = 0; i < providers.length; i++) {
        state.capabilities[providers[i].provider] = providers[i];
      }
      var sel = $('providerSelect');
      sel.innerHTML = '';
      var savedProvider = getStoredItem(PROVIDER_KEY);
      var haveSaved = false;
      for (var j = 0; j < providers.length; j++) {
        var opt = document.createElement('option');
        opt.value = providers[j].provider;
        opt.innerHTML = escapeHtml(providers[j].provider);
        sel.appendChild(opt);
        if (providers[j].provider === savedProvider) { haveSaved = true; }
      }
      if (haveSaved) { sel.value = savedProvider; }
      onProviderChange();
    }, function () {});
  }

  function currentCapabilities() {
    var provider = $('providerSelect').value;
    return state.capabilities[provider] || null;
  }

  function onProviderChange() {
    var provider = $('providerSelect').value;
    setStoredItem(PROVIDER_KEY, provider);
    loadModelsForProvider(provider);
    renderPermissionModeOptions();
  }

  function loadModelsForProvider(provider) {
    var modelSel = $('modelSelect');
    modelSel.innerHTML = '';
    if (!provider) { return; }
    if (state.modelsByProvider[provider]) {
      renderModelOptions(state.modelsByProvider[provider]);
      return;
    }
    xhr('GET', '/api/providers/' + encodeURIComponent(provider) + '/models', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var models = (payload && payload.models) || null;
      state.modelsByProvider[provider] = models;
      if (provider === $('providerSelect').value) {
        renderModelOptions(models);
      }
    }, function () {});
  }

  function renderModelOptions(models) {
    var modelSel = $('modelSelect');
    modelSel.innerHTML = '';
    var options = (models && models.OPTIONS) || [];
    var savedModel = getStoredItem(MODEL_KEY);
    var haveSaved = false;
    for (var i = 0; i < options.length; i++) {
      var opt = document.createElement('option');
      opt.value = options[i].value;
      opt.innerHTML = escapeHtml(options[i].label || options[i].value);
      modelSel.appendChild(opt);
      if (options[i].value === savedModel) { haveSaved = true; }
    }
    if (haveSaved) {
      modelSel.value = savedModel;
    } else if (models && models.DEFAULT) {
      modelSel.value = models.DEFAULT;
    }
    renderEffortOptions(options);
  }

  function currentModelOption(options) {
    var modelSel = $('modelSelect');
    for (var i = 0; i < options.length; i++) {
      if (options[i].value === modelSel.value) { return options[i]; }
    }
    return null;
  }

  function renderEffortOptions(options) {
    var effortSel = $('effortSelect');
    effortSel.innerHTML = '';
    var caps = currentCapabilities();
    if (!caps || !caps.supportsEffort) {
      effortSel.style.display = 'none';
      effortSel.previousElementSibling.style.display = 'none';
      return;
    }
    var modelOpt = currentModelOption(options || (state.modelsByProvider[$('providerSelect').value] || {}).OPTIONS || []);
    var values = (modelOpt && modelOpt.effort && modelOpt.effort.values) || [];
    if (!values.length) {
      effortSel.style.display = 'none';
      effortSel.previousElementSibling.style.display = 'none';
      return;
    }
    effortSel.style.display = '';
    effortSel.previousElementSibling.style.display = '';
    var savedEffort = getStoredItem(EFFORT_KEY);
    var haveSaved = false;
    for (var i = 0; i < values.length; i++) {
      var opt = document.createElement('option');
      opt.value = values[i].value;
      opt.innerHTML = escapeHtml(values[i].value);
      effortSel.appendChild(opt);
      if (values[i].value === savedEffort) { haveSaved = true; }
    }
    var def = (modelOpt && modelOpt.effort && modelOpt.effort.default) || '';
    if (haveSaved) {
      effortSel.value = savedEffort;
    } else if (def) {
      effortSel.value = def;
    }
  }

  function renderPermissionModeOptions() {

    permSel.innerHTML = '';
    var caps = currentCapabilities();
    var modes = (caps && caps.permissionModes) || [];
    var savedMode = getStoredItem(PERMISSION_KEY);

      opt.innerHTML = escapeHtml(modes[i]);
      permSel.appendChild(opt);
      if (modes[i] === savedMode) { haveSaved = true; }

      var projects = Array.isArray(projData) ? projData : [];

  function renderSessions() {
    var el = $('sessionList');
    el.innerHTML = '';
    var sessions = state.sessions;
    if (!sessions || !Array.isArray(sessions)) {
      sessions = [];
    }
    for (var i = 0; i < sessions.length; i++) {
      (function (s) {
        var row = document.createElement('div');
        row.className = 'row';
        var sid = s.sessionId || s.id;
        var title = sessionTitle(s);
        row.innerHTML = '<div><div>' + escapeHtml(title) + '</div><div class="meta">' + escapeHtml(sid) + '</div></div>';
        row.onclick = function () {
          openChat(sid, title);
        };
        el.appendChild(row);
      })(sessions[i]);

  function newSession() {
    var provider = $('providerSelect').value;
    if (!provider) {
      setErr('No provider available');
      return;
    }
    var model = $('modelSelect').value || '';
    var effort = ($('effortSelect').style.display !== 'none') ? ($('effortSelect').value || '') : '';
    var permissionMode = $('permissionModeSelect').value || '';

    setStoredItem(PROVIDER_KEY, provider);
    if (model) { setStoredItem(MODEL_KEY, model); }
    if (effort) { setStoredItem(EFFORT_KEY, effort); }
    if (permissionMode) { setStoredItem(PERMISSION_KEY, permissionMode); }

    xhr('POST', '/api/providers/sessions', { provider: provider, projectId: state.currentProjectId }, authHeaders(), function (data) {
      var payload = unwrap(data);
      var sessionId = (payload && payload.sessionId) || (data && data.sessionId);
      if (sessionId) {
        var options = {};
        if (model) { options.model = model; }
        if (effort) { options.effort = effort; }
        if (permissionMode) { options.permissionMode = permissionMode; }
        state.sessionOptions[sessionId] = options;
        openChat(sessionId, 'Chat');
      } else {
        setErr('Failed to create session');
      }
    }, function (data) {
      setErr((data && data.error) || 'Failed to create session');
    });
  }

      sessionId: sessionId,

    xhr('GET', '/api/providers/sessions/' + encodeURIComponent(sessionId) + '/messages', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var messages = (payload && payload.messages) || [];
      for (var i = 0; i < messages.length; i++) {
        renderMessage(messages[i]);
      }
      scrollChatToBottom();

  function reloadMessagesForRefresh(onDone) {
    var sessionId = state.currentSessionId;
    xhr('GET', '/api/providers/sessions/' + encodeURIComponent(sessionId) + '/messages', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var messages = (payload && payload.messages) || [];
      $('chatList').innerHTML = '';
      state.lastAssistantEl = null;
      for (var i = 0; i < messages.length; i++) {
        renderMessage(messages[i]);
      }
      scrollChatToBottom();
      if (onDone) { onDone(); }
    }, function () {
      if (onDone) { onDone(); }
    });

  function isJsonDump(s) {
    if (typeof s !== 'string') { return true; }
    var trimmed = s.replace(/^\s+/, '');
    return trimmed.charAt(0) === '{';
  }

  function shouldRenderMessage(m) {
    if (!m) { return false; }
    if (m.kind === 'text') { return true; }
    var role = m.role;
    if (role !== 'user' && role !== 'assistant') { return false; }
    if (m.kind && DROP_KINDS.hasOwnProperty(m.kind)) { return false; }
    var text = m.displayText;
    if (typeof text !== 'string' && typeof m.content === 'string') {
      text = m.content;
    }
    if (typeof text !== 'string' || !text.length) { return false; }
    if (isJsonDump(text)) { return false; }
    return true;
  }

  function messageText(m) {
    if (typeof m.displayText === 'string') { return m.displayText; }
    if (typeof m.content === 'string') { return m.content; }
    return '';
  }

  function renderMessage(m) {
    if (!shouldRenderMessage(m)) { return; }
    var text = messageText(m);
    if (!text) { return; }
    var role = m.role;
    var div = document.createElement('div');
    var cls = role === 'user' ? 'msg user' : 'msg assistant';
    div.className = cls;
    div.innerHTML = renderMarkdown(text);
    $('chatList').appendChild(div);
    if (role === 'assistant') {
      state.lastAssistantEl = div;
    } else {
      state.lastAssistantEl = null;
    }
    keepTypingAtBottom();
  }

  function scrollChatToBottom() {
    var el = $('chatList');
    el.scrollTop = el.scrollHeight;
  }

  function showTyping() {
    if ($('typingIndicator')) { return; }
    var div = document.createElement('div');
    div.id = 'typingIndicator';
    div.className = 'msg assistant typing';
    div.innerHTML = '<span class="typingDots"><span></span><span></span><span></span></span>Thinking';
    $('chatList').appendChild(div);
    scrollChatToBottom();
  }

  function hideTyping() {
    var el = $('typingIndicator');
    if (el && el.parentNode) { el.parentNode.removeChild(el); }
  }

  function keepTypingAtBottom() {
    var el = $('typingIndicator');
    if (el) { $('chatList').appendChild(el); }
  }

  function wsUrl() {
    var proto = (window.location.protocol === 'https:') ? 'wss:' : 'ws:';
    return proto + '//' + window.location.host + '/ws?token=' + encodeURIComponent(state.token);
  }

  function connectWs() {
    if (state.ws) {
      try { state.ws.close(); } catch (e) {}
      state.ws = null;
    }
    var ws = new WebSocket(wsUrl());
    state.ws = ws;
    ws.onopen = function () {
      send({ type: 'chat.subscribe', sessions: [{ sessionId: state.currentSessionId }] });
    };
    ws.onmessage = function (evt) {
      var data = null;
      try {
        data = JSON.parse(evt.data);
      } catch (e) {
        return;
      }
      handleWsFrame(data);
    };
    ws.onclose = function () {};
    ws.onerror = function () {};

    function send(obj) {
      if (ws.readyState === 1) {
        ws.send(JSON.stringify(obj));
      }
    }
    state.wsSend = send;
  }

  function truncateJson(obj, max) {
    var s;
    try {
      s = JSON.stringify(obj);
    } catch (e) {
      s = String(obj);
    }
    if (!s) { return ''; }
    if (s.length > max) {
      s = s.substring(0, max) + '...';
    }
    return s;
  }

  function renderPermissionCard(requestId, toolName, input) {
    var card = document.createElement('div');
    card.className = 'permCard';

    var title = document.createElement('div');
    title.className = 'permTitle';
    title.appendChild(document.createTextNode(toolName || 'Permission'));
    card.appendChild(title);

    if (input) {
      var inputBox = document.createElement('div');
      inputBox.className = 'permInput';
      inputBox.appendChild(document.createTextNode(truncateJson(input, 400)));
      card.appendChild(inputBox);
    }

    var btnRow = document.createElement('div');
    btnRow.className = 'permBtns';

    var allowBtn = document.createElement('button');
    allowBtn.className = 'permBtn allow';
    allowBtn.appendChild(document.createTextNode('Allow'));

    var denyBtn = document.createElement('button');
    denyBtn.className = 'permBtn deny';
    denyBtn.appendChild(document.createTextNode('Deny'));

    var respond = function (allow) {
      allowBtn.disabled = true;
      denyBtn.disabled = true;
      if (state.wsSend) {
        state.wsSend({ type: 'chat.permission-response', requestId: requestId, allow: allow });
      }
      card.removeChild(btnRow);
      var status = document.createElement('div');
      status.className = 'permStatus';
      status.appendChild(document.createTextNode(allow ? 'Allowed' : 'Denied'));
      card.appendChild(status);
    };

    allowBtn.onclick = function () { respond(true); };
    denyBtn.onclick = function () { respond(false); };

    btnRow.appendChild(allowBtn);
    btnRow.appendChild(denyBtn);
    card.appendChild(btnRow);

    $('chatList').appendChild(card);
    scrollChatToBottom();
  }

  function handleWsFrame(data) {
    if (!data || typeof data !== 'object') { return; }
    var kind = data.kind || data.type;

    if (kind === 'chat_subscribed') {
      var pending = data.pendingPermissions;
      if (pending && Array.isArray(pending)) {
        for (var pi = 0; pi < pending.length; pi++) {
          var p = pending[pi];
          if (p && p.requestId) {
            renderPermissionCard(p.requestId, p.toolName, p.input);
          }
        }
      }
      return;
    }

    if (kind === 'permission_request' || kind === 'permission' || kind === 'chat.permission-request') {
      if (data.requestId) {
        renderPermissionCard(data.requestId, data.toolName, data.input);
      }
      return;
    }

    if (kind === 'complete' || kind === 'error' || kind === 'stream_end') {
      hideTyping();
    }

    if (kind && DROP_KINDS.hasOwnProperty(kind)) { return; }

    if (kind === 'stream_delta') {
      var deltaText = data.displayText;
      if (typeof deltaText !== 'string') {
        if (typeof data.content === 'string') {
          deltaText = data.content;
        } else {
          return;
        }
      }
      if (!deltaText.length || isJsonDump(deltaText)) { return; }
      if (state.lastAssistantEl) {
        state.lastAssistantEl.innerHTML = renderMarkdown(deltaText);
        keepTypingAtBottom();
      } else {
        renderMessage({ role: 'assistant', displayText: deltaText });
      }
      scrollChatToBottom();
      return;
    }

    var role = data.role;
    if (role !== 'user' && role !== 'assistant') { return; }
    renderMessage(data);
    scrollChatToBottom();
  }

  function sendChat() {
    var text = $('chatInput').value;
    if (!text) { return; }
    if (!state.wsSend) { return; }
    var frame = { type: 'chat.send', sessionId: state.currentSessionId, content: text };
    var options = state.sessionOptions[state.currentSessionId];
    if (options) {
      frame.options = options;
    }
    state.wsSend(frame);
    hideTyping();
    renderMessage({ role: 'user', kind: 'text', displayText: text });
    showTyping();
    scrollChatToBottom();
    $('chatInput').value = '';
  }

  function stopChat() {
    if (!state.wsSend) { return; }
    state.wsSend({ type: 'chat.abort', sessionId: state.currentSessionId });
    hideTyping();
  }

  // ---- Jobs ----

  function openJobs(fromScreen) {
    state.jobsFromScreen = fromScreen || 'screenCategories';
    showScreen('screenJobs');
    updateHashAndNav('screenJobs', { jobsFromScreen: state.jobsFromScreen });
    loadJobs();
    if (state.jobsPollTimer) { clearInterval(state.jobsPollTimer); }
    state.jobsPollTimer = setInterval(loadJobs, 5000);
  }

  function leaveJobs() {
    if (state.jobsPollTimer) {
      clearInterval(state.jobsPollTimer);
      state.jobsPollTimer = null;
    }
    var target = state.jobsFromScreen || 'screenCategories';
    showScreen(target);
    if (target === 'screenProjects') {
      updateHashAndNav('screenProjects', { categoryId: state.currentCategoryId, categoryName: state.currentCategoryName });
    } else if (target === 'screenSessions') {
      updateHashAndNav('screenSessions', {
        categoryId: state.currentCategoryId,
        categoryName: state.currentCategoryName,
        projectId: state.currentProjectId,
        projectName: state.currentProjectName
      });
    } else {
      updateHashAndNav('screenCategories', {});
    }
  }

  function loadJobs(onDone) {
    xhr('GET', '/api/agent-relay/jobs?active=true', null, authHeaders(), function (data) {
      var payload = unwrap(data);
      var jobs = (payload && payload.jobs) || [];
      renderJobs(jobs);
      if (onDone) { onDone(); }
    }, function (data) {
      var el = $('jobsList');
      el.innerHTML = '';
      var errDiv = document.createElement('div');
      errDiv.style.padding = '12px';
      errDiv.style.color = '#ff6b6b';
      errDiv.appendChild(document.createTextNode((data && data.error) || 'Failed to load jobs'));
      el.appendChild(errDiv);
      if (onDone) { onDone(); }
    });
  }

  function renderJobs(jobs) {
    var el = $('jobsList');
    el.innerHTML = '';
    if (!jobs || !jobs.length) {
      var empty = document.createElement('div');
      empty.style.padding = '12px';
      empty.style.color = '#999';
      empty.appendChild(document.createTextNode('No running jobs'));
      el.appendChild(empty);
      return;
    }
    for (var i = 0; i < jobs.length; i++) {
      (function (job) {
        var row = document.createElement('div');
        row.className = 'row jobRow';

        var top = document.createElement('div');
        top.className = 'jobTop';

        var labelDiv = document.createElement('div');
        labelDiv.appendChild(document.createTextNode(job.label || job.relay_id || ''));

        var statusDiv = document.createElement('div');
        statusDiv.className = 'meta jobStatus';
        statusDiv.appendChild(document.createTextNode(job.status || ''));

        top.appendChild(labelDiv);
        top.appendChild(statusDiv);
        row.appendChild(top);

        var summary = (job.result && job.result.summary) || job.task || '';
        if (summary) {
          var summaryDiv = document.createElement('div');
          summaryDiv.className = 'jobSummary';
          summaryDiv.appendChild(document.createTextNode(String(summary)));
          row.appendChild(summaryDiv);
        }

        var cancelBtn = document.createElement('button');
        cancelBtn.className = 'secondary small';
        cancelBtn.appendChild(document.createTextNode('Cancel'));
        cancelBtn.onclick = function () {
          cancelBtn.disabled = true;
          xhr('POST', '/api/agent-relay/jobs/' + encodeURIComponent(job.relay_id) + '/cancel', {}, authHeaders(), function () {
            loadJobs();
          }, function () {
            cancelBtn.disabled = false;
          });
        };
        row.appendChild(cancelBtn);

        el.appendChild(row);
      })(jobs[i]);
    }
  }

  // ---- Logout ----

  function logout() {
    state.token = null;
    state.currentCategoryId = null;
    state.currentProjectId = null;
    state.currentSessionId = null;
    if (state.ws) {
      try { state.ws.close(); } catch (e) {}
      state.ws = null;
    }
    if (state.jobsPollTimer) {
      clearInterval(state.jobsPollTimer);
      state.jobsPollTimer = null;
    }
    try {
      window.localStorage.removeItem(TOKEN_KEY);
    } catch (e) {}
    showScreen('screenLogin');
  }

  // ---- Wire up ----

  $('btnLogin').onclick = doLogin;
  $('btnThemeLogin').onclick = toggleTheme;
  $('btnThemeCategories').onclick = toggleTheme;
  $('btnThemeProjects').onclick = toggleTheme;
  $('btnThemeSessions').onclick = toggleTheme;
  $('btnThemeChat').onclick = toggleTheme;
  $('btnThemeJobs').onclick = toggleTheme;
  $('providerSelect').onchange = onProviderChange;
  $('modelSelect').onchange = function () { renderEffortOptions(); };
  $('btnLogoutCategories').onclick = logout;
  $('btnBackToCategories').onclick = function () { navGoCategories(); };
  $('btnBackToProjects').onclick = function () {
    openCategory(state.currentCategoryId, state.currentCategoryName || 'Projects');
  };
  $('btnBackToSessions').onclick = function () {
    if (state.ws) {
      try { state.ws.close(); } catch (e) {}
      state.ws = null;
    }
    hideTyping();
    showScreen('screenSessions');
    updateHashAndNav('screenSessions', {
      categoryId: state.currentCategoryId,
      categoryName: state.currentCategoryName,
      projectId: state.currentProjectId,
      projectName: state.currentProjectName
    });
  };
  $('btnNewSession').onclick = newSession;
  $('btnSend').onclick = sendChat;
  $('btnStopChat').onclick = stopChat;
  $('btnJobsFromChat').onclick = function () { openJobs('screenSessions'); };
  $('tabChatFromCategories').onclick = function () { navGoCategories(); };
  $('tabJobsFromCategories').onclick = function () { openJobs('screenCategories'); };
  $('tabChatFromProjects').onclick = function () { navGoCategories(); };
  $('tabJobsFromProjects').onclick = function () { openJobs('screenProjects'); };
  $('tabChatFromSessions').onclick = function () { navGoCategories(); };
  $('tabJobsFromSessions').onclick = function () { openJobs('screenSessions'); };
  $('btnRefreshJobs').onclick = function () { loadJobs(); };
  $('btnBackFromJobs').onclick = leaveJobs;

  applyTheme(getStoredItem(THEME_KEY) || 'dark');

  window.addEventListener('hashchange', function () {
    if (state.suppressHashChange) {
      state.suppressHashChange = false;
      return;
    }
    if (!state.token) { return; }
    applyRouteFromHash();
  }, false);

  // ---- Pull to refresh ----

  var ptr = { active: false, startY: 0, dy: 0 };

  function isAtTop() {
    if (state.activeScreen === 'screenChat') {
      var cl = $('chatList');
      return cl.scrollTop === 0;
    }
    var doc = document.documentElement;
    var body = document.body;
    return (window.pageYOffset || 0) === 0 && (doc.scrollTop || 0) === 0 && (body.scrollTop || 0) === 0;
  }

  function showPtrBar() { $('ptrBar').style.display = 'block'; }
  function hidePtrBar() { $('ptrBar').style.display = 'none'; }

  function ptrRefreshCurrent() {
    var screen = state.activeScreen;
    var done = function () { hidePtrBar(); };
    if (screen === 'screenCategories') {
      loadCategories(false, done);
    } else if (screen === 'screenProjects') {
      reloadProjectsForRefresh(done);
    } else if (screen === 'screenSessions') {
      loadSessions(done);
    } else if (screen === 'screenJobs') {
      loadJobs(done);
    } else if (screen === 'screenChat') {
      reloadMessagesForRefresh(done);
    } else {
      hidePtrBar();
    }
  }

  document.addEventListener('touchstart', function (e) {
    if (state.activeScreen === 'screenLogin') { ptr.active = false; return; }
    if (!e.touches || e.touches.length !== 1) { ptr.active = false; return; }
    if (!isAtTop()) { ptr.active = false; return; }
    ptr.active = true;
    ptr.startY = e.touches[0].clientY;
    ptr.dy = 0;
  }, false);

  document.addEventListener('touchmove', function (e) {
    if (!ptr.active) { return; }
    if (!e.touches || e.touches.length !== 1) { return; }
    ptr.dy = e.touches[0].clientY - ptr.startY;
    if (ptr.dy > 0 && isAtTop()) {
      if (ptr.dy > 20) { showPtrBar(); }
    } else {
      ptr.active = false;
      hidePtrBar();
    }
  }, false);

  document.addEventListener('touchend', function () {
    if (!ptr.active) { return; }
    ptr.active = false;
    if (ptr.dy > 70) {
      ptrRefreshCurrent();
    } else {
      hidePtrBar();
    }
    ptr.dy = 0;
  }, false);

  // Try restoring existing token
  (function init() {
    var saved = null;
    try {
      saved = window.localStorage.getItem(TOKEN_KEY);
    } catch (e) {}
    if (saved) {
      state.token = saved;
      loadCategories(true);
    }
  })();

})();
</script>

</body>
