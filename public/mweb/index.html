  function setStoredItem(key, value) {

  function getDraftMap() {
    var raw = getStoredItem(DRAFT_KEY);
    if (!raw) { return {}; }
    try {
      var parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object') ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function saveDraft(sessionId, text) {
    if (!sessionId) { return; }
    var map = getDraftMap();
    var value = text || '';
    if (value.length > 20000) { value = value.substring(0, 20000); }
    if (value) {
      map[sessionId] = value;
    } else {
      delete map[sessionId];
    }
    setStoredItem(DRAFT_KEY, JSON.stringify(map));
  }

  function loadDraft(sessionId) {

  var THEME_META = {
    fog: { cls: 'theme-fog', bg: '#eceef1', bar: '#e2e6ea', status: 'default' },
    paper: { cls: 'theme-paper', bg: '#f4efe4', bar: '#ebe4d4', status: 'default' },
    dusk: { cls: 'theme-dusk', bg: '#1c1a17', bar: '#25221c', status: 'black' },
    ink: { cls: 'theme-ink', bg: '#16181a', bar: '#222528', status: 'black' }
  };

  function normalizeTheme(theme) {
    if (theme === 'light' || theme === 'paper') { return 'paper'; }
    if (theme === 'dark' || theme === 'dusk') { return 'dusk'; }
    if (theme === 'fog') { return 'fog'; }
    if (theme === 'ink') { return 'ink'; }
    return 'fog';
  }

  function normalizeFont(size) {
    if (size === 'sm' || size === 'small') { return 'sm'; }
    if (size === 'lg' || size === 'large') { return 'lg'; }
    return 'md';
  }

  function chromeClassName(themeName, fontName) {
    var theme = normalizeTheme(themeName);
    var font = normalizeFont(fontName);
    var meta = THEME_META[theme] || THEME_META.fog;
    return meta.cls + ' font-' + font;
  }

  function updateThemeButtons(name) {
    var ids = ['btnThemeLogin', 'btnThemeCategories', 'btnThemeProjects', 'btnThemeSessions', 'btnThemeChat', 'btnThemeReview', 'btnThemeGit'];
    var i;
    var el;

    var sizes = ['typeSizeSm', 'typeSizeMd', 'typeSizeLg'];

    for (i = 0; i < ids.length; i++) {

    for (i = 0; i < choices.length; i++) {
      el = $(choices[i]);

      el.className = el.getAttribute('data-theme') === name ? 'themeChoice secondary current' : 'themeChoice secondary';
    }
    for (i = 0; i < sizes.length; i++) {

  function applyTheme(theme) {

    var font = normalizeFont(getStoredItem(FONT_KEY));
    var meta = THEME_META[name] || THEME_META.fog;
    var cls = chromeClassName(name, font);
    var root = document.documentElement;
    var metaColor = document.getElementById('metaThemeColor');
    var metaBar = document.getElementById('metaStatusBar');
    document.body.className = cls;
    root.className = cls;
    root.style.backgroundColor = meta.bg;
    document.body.style.backgroundColor = meta.bg;
    if (metaColor) { metaColor.setAttribute('content', meta.bar); }
    if (metaBar) { metaBar.setAttribute('content', meta.status); }
    updateThemeButtons(name);

  function formatMsgTime(iso) {
    if (!iso) { return ''; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return ''; }
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function copyPlainText(text) {
    var ta = document.getElementById('copyHelper');
    if (!ta) {
      ta = document.createElement('textarea');
      ta.id = 'copyHelper';
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'absolute';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      ta.style.height = '1px';
      ta.style.width = '1px';
      document.body.appendChild(ta);
    }
    ta.value = text || '';
    var prevEditable = ta.contentEditable;
    ta.contentEditable = 'true';
    ta.focus();
    ta.select();
    try {
      ta.setSelectionRange(0, ta.value.length);
    } catch (e1) {}
    try {
      document.execCommand('copy');
    } catch (e2) {}
    ta.contentEditable = prevEditable;
    try { ta.blur(); } catch (e3) {}
  }

  function toggleTheme() {
    openThemePicker();
  }

  function xhr(method, url, body, headers, onSuccess, onError) {
    var req = new XMLHttpRequest();
    req.open(method, url, true);
    req.setRequestHeader('Content-Type', 'application/json');
    if (headers) {
      for (var k in headers) {
        if (headers.hasOwnProperty(k)) {
          req.setRequestHeader(k, headers[k]);
        }
      }
    }
    req.onreadystatechange = function () {
      if (req.readyState === 4) {
        var refreshed = null;
        try { refreshed = req.getResponseHeader('X-Refreshed-Token'); } catch (e0) {}
        if (refreshed) {
          state.token = refreshed;
          setStoredItem(TOKEN_KEY, refreshed);
        }
        var data = null;
        try {
          data = req.responseText ? JSON.parse(req.responseText) : null;
        } catch (e) {
          data = null;
        }
        if (req.status >= 200 && req.status < 300) {
          if (onSuccess) { onSuccess(data); }
        } else {
          if (onError) { onError(data, req.status); }
        }
      }
    };
    req.send(body ? JSON.stringify(body) : null);
  }

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + state.token };
  }

  function unwrap(data) {
    if (data && typeof data === 'object' && data.hasOwnProperty('data')) {
      return data.data;
    }
    return data;
  }

  // ---- Hash routing ----

  function saveNav(obj) {
    setStoredItem(NAV_KEY, JSON.stringify(obj));
  }

  function getNav() {
    var raw = getStoredItem(NAV_KEY);
    if (!raw) { return null; }
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function catToken(categoryId) {
    return (categoryId === null || categoryId === undefined || categoryId === '') ? 'uncat' : categoryId;
  }

  function buildHash(screen, params) {
    params = params || {};
    if (screen === 'screenCategories') { return '#/categories'; }
    if (screen === 'screenProjects') {
      return '#/projects/' + encodeURIComponent(catToken(params.categoryId));
    }
    if (screen === 'screenSessions') {
      return '#/sessions/' + encodeURIComponent(params.projectId || '');
    }
    if (screen === 'screenChat') {
      return '#/chat/' + encodeURIComponent(params.sessionId || '') +
        '?p=' + encodeURIComponent(params.projectId || '') +
        '&c=' + encodeURIComponent(catToken(params.categoryId));
    }
    if (screen === 'screenGit') {
      return '#/git/' + encodeURIComponent(params.projectId || '');
    }
    if (screen === 'screenReview') { return '#/review'; }
    return '#/categories';
  }

  function updateHashAndNav(screen, params) {
    params = params || {};
    var hash = buildHash(screen, params);
    if (window.location.hash !== hash) {
      state.suppressHashChange = true;
      window.location.hash = hash;
    }
    saveNav({
      screen: screen,
      categoryId: (params.categoryId !== undefined) ? params.categoryId : state.currentCategoryId,
      categoryName: (params.categoryName !== undefined) ? params.categoryName : state.currentCategoryName,
      projectId: (params.projectId !== undefined) ? params.projectId : state.currentProjectId,
      projectName: (params.projectName !== undefined) ? params.projectName : state.currentProjectName,
      sessionId: (params.sessionId !== undefined) ? params.sessionId : state.currentSessionId,
      title: params.title
    });
  }

  function parseHash() {
    var h = window.location.hash || '';
    if (h.charAt(0) === '#') { h = h.substring(1); }
    if (h.charAt(0) === '/') { h = h.substring(1); }
    var qIndex = h.indexOf('?');
    var query = '';
    if (qIndex !== -1) {
      query = h.substring(qIndex + 1);
      h = h.substring(0, qIndex);
    }
    var parts = h.split('/');
    var route = {
      name: parts[0] || '',
      id: (parts[1] !== undefined && parts[1] !== '') ? decodeURIComponent(parts[1]) : null,
      query: {}
    };
    if (query) {
      var pairs = query.split('&');
      for (var i = 0; i < pairs.length; i++) {
        var kv = pairs[i].split('=');
        if (kv[0]) { route.query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); }
      }
    }
    return route;
  }

  function findCategoryName(categoryId) {
    for (var i = 0; i < state.categories.length; i++) {
      if (state.categories[i].categoryId === categoryId) {
        return state.categories[i].name || categoryId;
      }
    }
    return categoryId || 'Category';
  }

  function findProjectName(projectId) {
    for (var i = 0; i < state.projects.length; i++) {
      if (state.projects[i].projectId === projectId) {
        return state.projects[i].displayName || projectId;
      }
    }
    return projectId || 'Project';
  }

  function navGoCategories() {
    renderCategories();
    showScreen('screenCategories');
    updateHashAndNav('screenCategories', {});
  }

  function applyRouteFromHash() {
    var route = parseHash();
    if (!route.name || route.name === 'categories') {
      navGoCategories();
      return;
    }
    if (route.name === 'projects') {
      var categoryId = (route.id === 'uncat' || route.id === null) ? null : route.id;
      var categoryName = (categoryId === null) ? 'Uncategorized' : findCategoryName(categoryId);
      openCategory(categoryId, categoryName);
      return;
    }
    if (route.name === 'sessions') {
      var projectId = route.id;
      if (!projectId) { navGoCategories(); return; }
      var nav = getNav();
      if (nav && nav.projectId === projectId) {
        state.currentCategoryId = (nav.categoryId === 'uncat') ? null : nav.categoryId;
        state.currentCategoryName = nav.categoryName || state.currentCategoryName;
      }
      openProject(projectId, findProjectName(projectId));
      return;
    }
    if (route.name === 'chat') {
      var sessionId = route.id;
      if (!sessionId) { navGoCategories(); return; }
      var pid = route.query.p;
      var cid = route.query.c;
      if (pid) {
        state.currentProjectId = pid;
        state.currentProjectName = findProjectName(pid);
      }
      if (cid !== undefined && cid !== '') {
        state.currentCategoryId = (cid === 'uncat') ? null : cid;
      }
      var navChat = getNav();
      var title = (navChat && navChat.title) || 'Chat';
      openChat(sessionId, title, (navChat && navChat.provider) || '');
      return;
    }
    if (route.name === 'review') {
      openReview();
      return;
    }
    if (route.name === 'git') {
      var gitProjectId = route.id;
      if (!gitProjectId) { navGoCategories(); return; }
      var navGit = getNav();
      if (navGit && navGit.projectId === gitProjectId) {
        state.currentCategoryId = (navGit.categoryId === 'uncat') ? null : navGit.categoryId;
        state.currentCategoryName = navGit.categoryName || state.currentCategoryName;
        state.currentProjectName = navGit.projectName || findProjectName(gitProjectId);
      } else {
        state.currentProjectName = findProjectName(gitProjectId);
      }
      openGit(gitProjectId, state.currentProjectName);
      return;
    }
    navGoCategories();
  }

  // ---- Login ----

  function doLogin() {
    setErr('');
    var username = $('loginUser').value;
    var password = $('loginPass').value;
    var body = { username: username, password: password };
    if ($('totpWrap').style.display !== 'none') {
      body.totpCode = $('loginTotp').value;
    }
    xhr('POST', '/api/auth/login', body, null, function (data) {
      if (data && data.requiresTotp) {
        $('totpWrap').style.display = 'block';
        setErr('Enter your TOTP code');
        return;
      }
      if (data && data.success && data.token) {
        state.token = data.token;
        try {
          window.localStorage.setItem(TOKEN_KEY, data.token);
        } catch (e) {}
        state.suppressHashChange = true;
        window.location.hash = '';
        loadCategories(false);
      } else {
        setErr((data && data.error) || 'Login failed');
      }
    }, function (data) {
      setErr((data && data.error) || 'Login failed');
    });
  }

  // ---- Categories ----

  function loadCategories(restoreRoute, onDone) {
    xhr('GET', '/api/projects/categories', null, authHeaders(), function (data) {
      var categories = (data && data.success && data.categories) || (data && data.categories) || [];
      if (!categories.length && data) {
        var unwrapped = unwrap(data);
        categories = (unwrapped && unwrapped.categories) || [];
      }
      state.categories = categories;
      xhr('GET', '/api/projects', null, authHeaders(), function (projData) {
        var projects = Array.isArray(projData) ? projData : [];
        state.projects = projects;
        if (restoreRoute) {
          applyRouteFromHash();
        } else {
          navGoCategories();
        }
        if (onDone) { onDone(); }
      }, function (projData) {
        setErr((projData && projData.error) || 'Failed to load projects');
        if (onDone) { onDone(); }
      });
    }, function (data) {
      setErr((data && data.error) || 'Failed to load categories');
      if (onDone) { onDone(); }
    });
  }

  function projectsForCategory(categoryId) {
    var out = [];
    for (var i = 0; i < state.projects.length; i++) {
      var p = state.projects[i];
      var pcid = p.categoryId || null;
      if (categoryId === null) {
        if (!pcid) { out.push(p); }
      } else if (pcid === categoryId) {
        out.push(p);
      }
    }
    return out;
  }

  function renderCategories() {
    var el = $('categoryList');
    el.innerHTML = '';
    var cats = state.categories.slice();
    cats.sort(function (a, b) {
      var sa = (typeof a.sortOrder === 'number') ? a.sortOrder : 0;
      var sb = (typeof b.sortOrder === 'number') ? b.sortOrder : 0;
      return sa - sb;
    });
    for (var i = 0; i < cats.length; i++) {
      (function (c) {
        var count = projectsForCategory(c.categoryId).length;
        var row = document.createElement('div');
        row.className = 'row';
        var swatch = '<span class="swatch" style="background:' + escapeHtml(c.color || '#666') + ';"></span>';
        row.innerHTML = '<div class="rowMain">' + swatch + '<div>' + escapeHtml(c.name || c.categoryId) + '</div></div><div class="meta">' + count + '</div>';
        row.onclick = function () {
          openCategory(c.categoryId, c.name || c.categoryId);
        };
        el.appendChild(row);
      })(cats[i]);
    }
    var uncategorized = projectsForCategory(null);
    if (uncategorized.length) {
      var urow = document.createElement('div');
      urow.className = 'row';
      urow.innerHTML = '<div class="rowMain"><span class="swatch" style="background:#555;"></span><div>Uncategorized</div></div><div class="meta">' + uncategorized.length + '</div>';
      urow.onclick = function () {
        openCategory(null, 'Uncategorized');
      };
      el.appendChild(urow);
    }
  }

  function openCategory(categoryId, name) {
    state.currentCategoryId = categoryId;
    state.currentCategoryName = name;
    $('projectsTitle').innerHTML = escapeHtml(name);
    updateGitEntryButtons();
    renderProjects();
    showScreen('screenProjects');
    updateHashAndNav('screenProjects', { categoryId: categoryId, categoryName: name });
  }

  function renderProjects() {
    var el = $('projectList');
    el.innerHTML = '';
    var projects = projectsForCategory(state.currentCategoryId);
    for (var i = 0; i < projects.length; i++) {
      (function (p) {
        var row = document.createElement('div');

        var name = p.displayName || p.projectId;
        var pathStr = p.fullPath || p.path || '';
        row.innerHTML = '<div><div>' + escapeHtml(name) + '</div><div class="meta">' + escapeHtml(pathStr) + '</div></div>';
        row.onclick = function () {
          openProject(p.projectId, name);

        el.appendChild(row);

    state.currentProjectId = projectId;

    var btn = $('btnGitFromProjects');

      btn.style.display = state.currentProjectId ? '' : 'none';
