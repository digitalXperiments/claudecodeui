<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bot Studio — clickable prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --background:44 22% 96%; --foreground:36 25% 4%; --card:0 0% 100%; --primary:221.2 83.2% 53.3%; --primary-foreground:210 40% 98%;
    --secondary:44 15% 91%; --muted:44 15% 91%; --muted-foreground:40 5% 44%; --destructive:0 84.2% 60.2%; --border:44 14% 87%; --input:44 14% 87%;
    --ok:152 60% 40%; --warn:38 92% 50%; --bad:0 72% 55%; --radius:.5rem;
  }
  .dark{
    --background:0 0% 8%; --foreground:40 8% 93%; --card:0 0% 12%; --primary:217.2 91.2% 59.8%; --primary-foreground:0 0% 8%;
    --secondary:0 0% 17%; --muted:0 0% 17%; --muted-foreground:40 6% 72%; --destructive:0 62.8% 45%; --border:0 0% 17%; --input:0 0% 23%;
    --ok:152 55% 52%; --warn:38 92% 58%; --bad:0 72% 62%;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font-family:"Encode Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:hsl(var(--background));color:hsl(var(--foreground));font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  a{color:hsl(var(--primary))}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:hsl(var(--border));border-radius:8px}

  /* ---------- shell ---------- */
  #app{display:flex;flex-direction:column;height:100%;min-height:0}
  header.top{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid hsl(var(--border)/.7);background:hsl(var(--card)/.8);backdrop-filter:blur(12px);flex-shrink:0}
  header.top h1{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.02em;border:1px solid hsl(var(--border));color:hsl(var(--muted-foreground));background:hsl(var(--muted)/.4)}
  .pill.ok{color:hsl(var(--ok));border-color:hsl(var(--ok)/.35);background:hsl(var(--ok)/.1)}
  .pill.warn{color:hsl(var(--warn));border-color:hsl(var(--warn)/.35);background:hsl(var(--warn)/.1)}
  .pill.bad{color:hsl(var(--bad));border-color:hsl(var(--bad)/.35);background:hsl(var(--bad)/.1)}
  .pill.primary{color:hsl(var(--primary));border-color:hsl(var(--primary)/.35);background:hsl(var(--primary)/.1)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
  .live .dot{animation:pulse 1.6s infinite} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .grow{flex:1}
  .seg{display:inline-flex;padding:2px;border-radius:8px;background:hsl(var(--muted)/.6);border:1px solid hsl(var(--border)/.7)}
  .seg button{padding:4px 11px;border-radius:6px;font-size:12px;font-weight:500;color:hsl(var(--muted-foreground))}
  .seg button.on{background:hsl(var(--card));color:hsl(var(--foreground));box-shadow:0 1px 2px rgb(0 0 0/.15)}
  .seg button .n{margin-left:5px;font-size:10px;padding:0 5px;border-radius:999px;background:hsl(var(--primary)/.15);color:hsl(var(--primary))}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1px solid hsl(var(--border));background:hsl(var(--card));font-size:12px;font-weight:500;white-space:nowrap}
  .btn:hover{border-color:hsl(var(--primary)/.5)}
  .btn.primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:transparent}
  .btn.ghost{border-color:transparent;background:transparent;color:hsl(var(--muted-foreground))} .btn.ghost:hover{background:hsl(var(--muted)/.6);color:hsl(var(--foreground))}
  .btn.danger{color:hsl(var(--bad));border-color:hsl(var(--bad)/.35)}
  .btn.sm{padding:3px 8px;font-size:11px;border-radius:6px}
  .btn.icon{padding:6px;width:30px;justify-content:center}
  .btn.on{background:hsl(var(--primary)/.12);color:hsl(var(--primary));border-color:hsl(var(--primary)/.4)}
  .search{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;border:1px solid hsl(var(--border));background:hsl(var(--muted)/.4);color:hsl(var(--muted-foreground));font-size:12px;min-width:220px}
  kbd{font-family:inherit;font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid hsl(var(--border));background:hsl(var(--card));color:hsl(var(--muted-foreground))}
  .toggle{width:32px;height:18px;border-radius:999px;background:hsl(var(--muted));position:relative;border:1px solid hsl(var(--border));transition:.15s}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:hsl(var(--muted-foreground));transition:.15s}
  .toggle.on{background:hsl(var(--primary))} .toggle.on::after{left:16px;background:#fff}
  .toggle.kill.on{background:hsl(var(--bad))}

  main.body{display:grid;flex:1;min-height:0;grid-template-columns:var(--grid,280px 1px minmax(0,1fr) 1px 400px);transition:grid-template-columns .2s}
  .divider{background:hsl(var(--border)/.7)}
  aside{min-height:0;overflow:auto;background:hsl(var(--card)/.4)}
  aside.rail{padding:10px}
  aside.right{padding:0;display:flex;flex-direction:column}
  section.center{min-height:0;overflow:auto;display:flex;flex-direction:column}

  .eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:hsl(var(--muted-foreground));margin:12px 6px 6px}
  .eyebrow:first-child{margin-top:4px}
  .botrow{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .botrow:hover{background:hsl(var(--muted)/.5)} .botrow.on{background:hsl(var(--primary)/.1);border-color:hsl(var(--primary)/.3)}
  .botrow .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:hsl(var(--muted)/.7)}
  .botrow .nm{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px;min-width:0} .botrow .nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .botrow .sub{font-size:10.5px;color:hsl(var(--muted-foreground));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .botrow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .cnt{font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:inline-grid;place-items:center;background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
  .cnt.muted{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
  .mode{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px}
  .mode.propose{background:hsl(var(--primary)/.15);color:hsl(var(--primary))} .mode.act{background:hsl(var(--ok)/.15);color:hsl(var(--ok))} .mode.dry_run{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
  .rail .filters{display:flex;gap:4px;flex-wrap:wrap;margin:2px 4px 6px}
  .chip{padding:2px 8px;border-radius:999px;font-size:10.5px;border:1px solid hsl(var(--border));color:hsl(var(--muted-foreground));cursor:pointer;background:hsl(var(--card))}
  .chip.on{background:hsl(var(--foreground));color:hsl(var(--background));border-color:transparent}
  .navrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;cursor:pointer;font-weight:600;font-size:12.5px}
  .navrow:hover{background:hsl(var(--muted)/.5)} .navrow.on{background:hsl(var(--primary)/.1);color:hsl(var(--primary))}

  /* ---------- center ---------- */
  .toolbar{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid hsl(var(--border)/.7);position:sticky;top:0;background:hsl(var(--background)/.9);backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
  .toolbar h2{font-size:14px;font-weight:600;margin:0}
  .content{padding:14px 18px 40px;display:flex;flex-direction:column;gap:10px}
  .card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:12px;padding:12px 14px}
  .card h3{margin:0 0 6px;font-size:12.5px;font-weight:600}
  .muted{color:hsl(var(--muted-foreground))}
  .small{font-size:11px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat{padding:10px 12px;border-radius:10px;background:hsl(var(--muted)/.35);border:1px solid hsl(var(--border)/.6)}
  .stat .v{font-size:20px;font-weight:600;letter-spacing:-.01em} .stat .l{font-size:10.5px;color:hsl(var(--muted-foreground));text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .stat .d{font-size:10.5px;margin-top:2px}
  .up{color:hsl(var(--ok))} .down{color:hsl(var(--bad))}

  /* inbox item */
  .item{display:grid;grid-template-columns:22px 1fr;gap:10px;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
  .item:hover{border-color:hsl(var(--primary)/.4)} .item.on{border-color:hsl(var(--primary));box-shadow:0 0 0 3px hsl(var(--primary)/.12)}
  .item.leaving{opacity:.35;transform:translateX(8px)}
  .item .cb{width:15px;height:15px;border-radius:4px;border:1.5px solid hsl(var(--border));margin-top:3px;display:grid;place-items:center;font-size:10px}
  .item .cb.on{background:hsl(var(--primary));border-color:hsl(var(--primary));color:#fff}
  .item .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .item .ttl{font-weight:600;font-size:13px}
  .item .bd{margin-top:4px;color:hsl(var(--muted-foreground));font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
  .conf{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:hsl(var(--muted-foreground))} .conf i{display:inline-block;width:38px;height:4px;border-radius:2px;background:hsl(var(--muted));position:relative;overflow:hidden} .conf i b{position:absolute;inset:0;right:auto;background:hsl(var(--ok))}
  .src{margin-top:8px;padding:8px 10px;border-radius:8px;border:1px dashed hsl(var(--warn)/.5);background:hsl(var(--warn)/.06);font-size:11.5px;color:hsl(var(--muted-foreground))}
  .src .lab{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--warn));margin-bottom:3px}
  .status{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
  .status.pending{background:hsl(var(--primary)/.15);color:hsl(var(--primary))} .status.resolving{background:hsl(var(--warn)/.15);color:hsl(var(--warn))} .status.resolved{background:hsl(var(--ok)/.15);color:hsl(var(--ok))} .status.failed{background:hsl(var(--bad)/.15);color:hsl(var(--bad))} .status.running{background:hsl(var(--warn)/.15);color:hsl(var(--warn))} .status.graded{background:hsl(var(--ok)/.15);color:hsl(var(--ok))} .status.noop{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
  .batchbar{position:sticky;bottom:12px;margin:12px auto 0;display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;background:hsl(var(--foreground));color:hsl(var(--background));box-shadow:0 8px 30px rgb(0 0 0/.35);width:max-content}
  .batchbar .btn{background:transparent;color:inherit;border-color:hsl(var(--background)/.3)}

  /* bot detail */
  .bothead{padding:16px 18px 0;display:flex;gap:14px;align-items:flex-start}
  .bothead .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:hsl(var(--muted)/.7);flex-shrink:0}
  .bothead h2{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
  .tabs{display:flex;gap:2px;padding:10px 18px 0;border-bottom:1px solid hsl(var(--border)/.7);overflow:auto;position:sticky;top:0;background:hsl(var(--background));z-index:4}
  .tabs button{padding:8px 11px;font-size:12px;font-weight:500;color:hsl(var(--muted-foreground));border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .tabs button.on{color:hsl(var(--foreground));border-color:hsl(var(--primary))}
  .tabs button .n{font-size:10px;padding:0 5px;border-radius:999px;background:hsl(var(--primary)/.15);color:hsl(var(--primary))}
  .brief ol{margin:4px 0 0;padding-left:18px} .brief li{margin:3px 0}
  .brief .col{position:relative} .brief .col .edit{position:absolute;top:8px;right:8px}
  table{width:100%;border-collapse:collapse;font-size:12px} th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:hsl(var(--muted-foreground));font-weight:600;padding:6px 8px;border-bottom:1px solid hsl(var(--border))} td{padding:7px 8px;border-bottom:1px solid hsl(var(--border)/.5);vertical-align:middle}
  tr.click{cursor:pointer} tr.click:hover td{background:hsl(var(--muted)/.35)}
  .pol{display:inline-flex;padding:2px;border-radius:6px;background:hsl(var(--muted)/.6);border:1px solid hsl(var(--border)/.7)}
  .pol button{padding:1px 7px;font-size:10px;font-weight:600;border-radius:4px;color:hsl(var(--muted-foreground))}
  .pol button.allow.on{background:hsl(var(--ok)/.2);color:hsl(var(--ok))} .pol button.ask.on{background:hsl(var(--warn)/.2);color:hsl(var(--warn))} .pol button.deny.on{background:hsl(var(--bad)/.2);color:hsl(var(--bad))}
  .mcpsrv{border:1px solid hsl(var(--border));border-radius:12px;overflow:hidden;background:hsl(var(--card))}
  .mcpsrv .h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:hsl(var(--muted)/.3);cursor:pointer}
  .mcpsrv .h .lg{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:hsl(var(--card));border:1px solid hsl(var(--border))}
  .mcpsrv .tools{padding:4px 12px 8px;display:none} .mcpsrv.open .tools{display:block}
  .tool{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid hsl(var(--border)/.5)} .tool:last-child{border:0}
  .tool .nm{font-family:"JetBrains Mono",monospace;font-size:11px} .tool .ds{font-size:11px;color:hsl(var(--muted-foreground))}
  .diff{font-family:"JetBrains Mono",monospace;font-size:11px;line-height:1.55;border-radius:8px;overflow:hidden;border:1px solid hsl(var(--border))}
  .diff div{padding:1px 10px;white-space:pre-wrap} .diff .a{background:hsl(var(--ok)/.12);color:hsl(var(--ok))} .diff .r{background:hsl(var(--bad)/.12);color:hsl(var(--bad))} .diff .c{color:hsl(var(--muted-foreground))}
  .spark{display:block}
  .bar{height:6px;border-radius:3px;background:hsl(var(--muted));overflow:hidden} .bar b{display:block;height:100%;background:hsl(var(--primary))}
  .timeline{position:relative;padding-left:18px} .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:hsl(var(--border))}
  .tl{position:relative;padding:6px 0 10px} .tl::before{content:"";position:absolute;left:-16px;top:11px;width:7px;height:7px;border-radius:50%;background:hsl(var(--muted-foreground))}
  .tl.ok::before{background:hsl(var(--ok))} .tl.bad::before{background:hsl(var(--bad))} .tl.run::before{background:hsl(var(--warn));box-shadow:0 0 0 4px hsl(var(--warn)/.2)}

  /* architect */
  .arch{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:0;flex:1}
  .stepper{padding:18px 12px;border-right:1px solid hsl(var(--border)/.7);background:hsl(var(--card)/.3)}
  .step{display:flex;gap:10px;align-items:flex-start;padding:8px 8px;border-radius:10px;cursor:pointer}
  .step:hover{background:hsl(var(--muted)/.4)} .step.on{background:hsl(var(--primary)/.1)}
  .step .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid hsl(var(--border));flex-shrink:0;background:hsl(var(--card))}
  .step.done .num{background:hsl(var(--ok));border-color:hsl(var(--ok));color:#fff} .step.on .num{border-color:hsl(var(--primary));color:hsl(var(--primary))}
  .step .t{font-weight:600;font-size:12px} .step .s{font-size:10.5px;color:hsl(var(--muted-foreground))}
  .form{padding:20px 26px 60px;max-width:820px;display:flex;flex-direction:column;gap:14px}
  .form h2{margin:0;font-size:18px} .form p.lead{margin:0;color:hsl(var(--muted-foreground))}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:600;color:hsl(var(--muted-foreground))}
  .in{padding:8px 10px;border-radius:9px;border:1px solid hsl(var(--input));background:hsl(var(--card));font-size:12.5px;font-weight:400;color:hsl(var(--foreground));width:100%}
  .in:focus{outline:none;border-color:hsl(var(--primary));box-shadow:0 0 0 3px hsl(var(--primary)/.12)}
  textarea.in{min-height:70px;resize:vertical;font-family:inherit}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;border:1px solid hsl(var(--border));cursor:pointer;background:hsl(var(--card))}
  .opt.on{border-color:hsl(var(--primary));box-shadow:0 0 0 3px hsl(var(--primary)/.12)} .opt .t{font-weight:600;font-size:12.5px} .opt .s{font-size:11px;color:hsl(var(--muted-foreground))}
  .opt .ic{font-size:18px;width:26px;text-align:center}
  .footer{display:flex;gap:8px;align-items:center;padding-top:8px;border-top:1px solid hsl(var(--border)/.7);position:sticky;bottom:0;background:hsl(var(--background));padding-bottom:6px}
  .tagin{display:flex;gap:6px;flex-wrap:wrap;padding:6px;border:1px solid hsl(var(--input));border-radius:9px;background:hsl(var(--card));min-height:36px}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:hsl(var(--muted)/.6);font-size:11.5px}

  /* right pane */
  .rp-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid hsl(var(--border)/.7);font-weight:600;font-size:12.5px;flex-shrink:0}
  .rp-b{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .chat{display:flex;flex-direction:column;gap:10px} .msg{max-width:92%;padding:8px 11px;border-radius:12px;font-size:12px;line-height:1.5}
  .msg.me{align-self:flex-end;background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-bottom-right-radius:4px} .msg.bot{align-self:flex-start;background:hsl(var(--muted)/.6);border-bottom-left-radius:4px}
  .msg .tc{font-family:"JetBrains Mono",monospace;font-size:10.5px;padding:4px 8px;border-radius:6px;background:hsl(var(--background));margin:6px 0;color:hsl(var(--muted-foreground))}
  .composer{display:flex;gap:6px;padding:10px 12px;border-top:1px solid hsl(var(--border)/.7);flex-shrink:0}
  .composer .in{flex:1}
  .sugg{display:flex;gap:6px;flex-wrap:wrap}
  .preview{border-left:3px solid hsl(var(--primary));padding:8px 10px;background:hsl(var(--primary)/.06);border-radius:0 8px 8px 0;font-size:12px}
  .rp-empty{flex:1;display:grid;place-items:center;text-align:center;color:hsl(var(--muted-foreground));padding:30px}
  .rp-empty .big{font-size:30px;margin-bottom:8px}

  /* templates */
  .tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .tplc{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.15s}
  .tplc:hover{border-color:hsl(var(--primary)/.5);transform:translateY(-1px)}
  .tplc .ic{font-size:24px} .tplc .t{font-weight:600;font-size:13px} .tplc .s{font-size:11.5px;color:hsl(var(--muted-foreground));flex:1}
  .tplc .req{display:flex;gap:4px;flex-wrap:wrap}

  const arr = arr0.length>1 ? arr0 : [arr0[0]||0, arr0[0]||0];
  const max = Math.max(...arr,1), min = Math.min(...arr,0);
  const pts = arr.map((v,i)=>`${(i/(arr.length-1))*w},${h-((v-min)/(max-min||1))*(h-2)-1}`).join(' ');

function itemCard(i){
  const b = bot(i.bot);
  const acts = i.status==='pending' ? b.actions : (i.status==='failed' ? [{label:'Retry',kind:'retry'},{label:'Retry with escalation agent',kind:'retry'},{label:'Open issue instead',kind:'custom',terminal:true},{label:'Dismiss',kind:'dismiss',terminal:true}] : []);
  return `<div class="item ${S.itemId===i.id?'on':''}" id="item-${i.id}" onclick="selectItem('${i.id}')">
    <div class="cb ${S.sel.has(i.id)?'on':''}" onclick="event.stopPropagation();toggleSel('${i.id}')">${S.sel.has(i.id)?'✓':''}</div>
    <div>
      <div class="hd"><span class="pill">${b.icon} ${b.name}</span><span class="status ${i.status}">${i.status}</span><span class="ttl">${i.title}</span><span class="grow"></span><span class="conf"><i><b style="width:${i.conf*100}%"></b></i>${Math.round(i.conf*100)}%</span><span class="small muted">${i.age}</span></div>
      <div class="bd">${i.body}</div>
      ${i.source?`<div class="src"><div class="lab">Source · untrusted content<span class="note-tag" title="Quarantined external content">4</span></div>${i.source}</div>`:''}
      ${i.draft?`<div class="preview" style="margin-top:8px"><div class="small muted" style="margin-bottom:3px">Draft reply</div>${i.draft.replace(/\n/g,'<br>')}</div>`:''}
      ${acts.length?`<div class="acts">${acts.map(a=>`<button class="btn sm ${a.kind==='approve'?'primary':''} ${a.kind==='dismiss'?'ghost':''}" onclick="event.stopPropagation();act('${i.id}','${a.label}','${a.kind}',${!!a.terminal})">${a.hold?'🔒 ':''}${a.label}</button>`).join('')}<span class="grow"></span><button class="btn sm ghost" onclick="event.stopPropagation();S.previewed['${i.id}']=true;selectItem('${i.id}')">Preview</button><button class="btn sm ghost" onclick="event.stopPropagation();toast('Opened a session in ${b.scope==='project'?b.project:'the matching project'} with an implementer prompt')">Work this ↗</button></div>`:''}
    </div></div>`;
}
function selectItem(id){ S.itemId=id; S.rightOpen=true; render(); }
function toggleSel(id){ S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); }
function act(id,label,kind,terminal){
  const i = ITEMS.find(x=>x.id===id); const b = bot(i.bot);
  if(kind==='reply' && !terminal){ toast(`✍️ ${b.name} is redrafting with your steering note…`); i.status='resolving'; render(); setTimeout(()=>{i.status='pending'; i.draft = (i.draft||'Draft ready.') + '\n\n(redrafted · v2)'; render(); toast('Draft updated · back in Pending')},1400); return; }
  if(kind==='retry'){ i.status='resolving'; render(); setTimeout(()=>{i.status='pending'; i.title=i.title.replace('failed','retried'); render(); toast('Retried with escalation agent · new proposal ready')},1600); return; }
  if(kind==='dismiss'){ finish(i, 'dismissed', `${label} · ${b.name} will learn from this (human_review grader)`); return; }
  i.status='resolving'; render(); toast(`${label} · ${b.name} resolving…`);
  setTimeout(()=>finish(i,'resolved',`✅ ${label} done · ${i.title.slice(0,40)}…`),1500);
}
function finish(i,status,msg){ const el=$('#item-'+i.id); if(el) el.classList.add('leaving'); setTimeout(()=>{ i.status=status; const b=bot(i.bot); b.pending=Math.max(0,b.pending-1); const next=ITEMS.find(x=>x.status==='pending'); if(next) S.itemId=next.id; render(); toast(msg,'Undo'); },350); }
function batch(kind){ [...S.sel].forEach(id=>{const i=ITEMS.find(x=>x.id===id); if(i.status==='pending') act(id, kind==='approve'?'Approve':'Dismiss', kind, true)}); S.sel.clear(); }

function setMode(id,m){ const b=bot(id); if(m==='act' && !S.simulated && b.mode!=='act'){ toast('Run a Simulate first before switching to Act'); openSimulate(id); return;} b.mode=m; render(); toast(`${b.name} → ${m.replace('_',' ')}`); }
function toggleBot(id){ const b=bot(id); b.enabled=!b.enabled; b.group=b.enabled?(b.pending?'needs':'healthy'):'paused'; b.pausedReason='Paused by you · just now'; render(); }
function runNow(id){ S.running=id; S.rightOpen=true; S.rpMode='transcript'; render(); setTimeout(()=>{ const b=bot(id); b.ticks.unshift({id:'t-new',status:'graded',when:'just now',dur:'37s',tokens:'15.8k',cost:'$0.07',grade:.84,out:'1 item'}); if(b.actions.length){ ITEMS.unshift({id:'i'+Date.now(), bot:id, title:'New item from manual run', body:'Produced by the tick you just triggered. Proposal awaiting your decision.', conf:.8, age:'now', status:'pending', source:'Manual run · '+new Date().toLocaleTimeString(), kind:'custom'}); b.pending++; b.group='needs'; } S.running=null; render(); toast(`${b.name} tick graded 0.84 · 1 new item`); }, 3200); }

function tabOverview(b){
  return `<div class="grid4">
    <div class="stat"><div class="l">Pending</div><div class="v">${b.pending}</div><div class="d muted">${b.proposals} proposals</div></div>

    <div class="card" style="border-color:hsl(var(--primary)/.4)"><div class="row"><span style="font-size:22px">🎫</span><div><div style="font-weight:600">${a.name||'Untitled bot'}</div><div class="small muted">${a.purpose||'Purpose not set yet'}</div></div></div>
      <div class="row" style="margin-top:8px"><span class="mode propose">propose</span><span class="pill">paused</span><span class="pill">Claude sonnet-5</span>${a.mcp.map(k=>`<span class="pill">${MCP[k].lg}</span>`).join('')}</div>
      <div class="small muted" style="margin-top:6px">Live preview · updates as you go</div></div>
    <div class="chat">
      <div class="msg bot">Tell me what the bot should do and I'll draft the brief, pick tools and suggest graders. You can also paste a chat transcript or a doc.</div>
      ${a.briefDrafted?`<div class="msg me">Watch new DE Jira tickets, set priority and component, leave a first comment.</div><div class="msg bot">Drafted <b>start / steps / done</b> in step 3. I picked <b>Atlassian Rovo</b> (read allow, transition ask) and <b>obsidian</b> for the component map. Suggested graders: priority-within-30-min (command), correct-component (rubric). <div class="tc">POST /api/bots/draft · 1.2 s</div>Want a stricter default, like P1 only for checkout?</div>`:''}
    </div>
    <div class="sugg"><span class="chip" onclick="S.arch.briefDrafted=true;go('#/new/3')">Draft the brief</span><span class="chip" onclick="toast('Suggested: Atlassian Rovo + obsidian')">Suggest tools</span><span class="chip" onclick="toast('Suggested 3 graders in step 7')">Suggest graders</span></div>
  </div>
  <div class="composer"><input class="in" placeholder="Describe the bot or refine a step…" onkeydown="if(event.key==='Enter'){S.arch.briefDrafted=true;render();toast('Architect updated the brief')}"><button class="btn primary">Send</button></div>`;
}

/* ---------- MODALS / MISC ---------- */
function modal(html){ $('#modal-root').innerHTML = `<div class="backdrop" onclick="if(event.target===this)closeModal()">${html}</div>`; }
function closeModal(){ $('#modal-root').innerHTML=''; }
function openSimulate(id){ const b=bot(id); modal(`<div class="modal"><div class="mh"><h3>🧪 Simulate · ${b.name} v${b.version}</h3><span class="grow"></span><button class="btn ghost sm" onclick="closeModal()">✕</button></div><div class="mb">
  <div class="small muted">Runs a dry tick with real tool <b>reads</b> and no writes. Shows what would be emitted and which held actions would be taken, diffed against the last real tick.</div>
  <div class="row"><select class="in" style="width:auto"><option>Last 60 minutes</option><option>Yesterday 09:00–10:00</option><option>Paste a payload…</option></select><select class="in" style="width:auto"><option>v${b.version} (current)</option><option>v${b.version+1} (draft)</option></select><button class="btn primary" onclick="simRun('${id}')">Run</button></div>
  <div id="sim-out"></div></div></div>`); }
function simRun(id){ const b=bot(id); $('#sim-out').innerHTML=`<div class="running-strip"><span class="dot" style="color:hsl(var(--warn))"></span> simulating…</div>`; setTimeout(()=>{ S.simulated=true; $('#sim-out').innerHTML=`<div class="grid3"><div class="stat"><div class="l">Would emit</div><div class="v">3</div><div class="d muted">inbox items</div></div><div class="stat"><div class="l">Held actions</div><div class="v">1</div><div class="d muted">send_message</div></div><div class="stat"><div class="l">Est. cost</div><div class="v">$0.08</div><div class="d muted">graders 4/4</div></div></div>
  <div class="diff" style="margin-top:10px"><div class="c"> vs last real tick ${b.ticks[0]?.id||''}</div><div class="c">  item · Anustha — OData API access</div><div class="a">+ item · Shubhi — Q3 cost follow-up (new thread)</div><div class="r">- item · Looker digest (already archived)</div></div>
  <div class="row" style="margin-top:10px"><button class="btn primary" onclick="closeModal();toast('Act mode unlocked for ${b.name}')">Looks right · allow Act</button><button class="btn" onclick="closeModal()">Close</button></div>`; },1300); }
function openDiff(id,v){ const b=bot(id); modal(`<div class="modal"><div class="mh"><h3>Diff · v${v} → v${b.version}</h3><span class="grow"></span><button class="btn ghost sm" onclick="closeModal()">✕</button></div><div class="mb"><div class="diff"><div class="c"> brief.steps</div><div class="c">  Classify each thread: needs-reply / FYI / newsletter / automated.</div><div class="r">- For needs-reply, draft a reply in my voice.</div><div class="a">+ For needs-reply, draft a reply under 120 words in my voice; cite the thread.</div><div class="a">+ Never touch threads labelled \`legal\` or from \`finance@\`.</div><div class="c"> tools.gmail.send_message</div><div class="r">- allow</div><div class="a">+ ask</div><div class="c"> agent.escalation</div><div class="a">+ claude-fable-5-1 when grade < 0.6</div></div><div class="row"><button class="btn" onclick="closeModal();toast('Restored v${v} as v${b.version+1}')">Restore v${v}</button><button class="btn ghost" onclick="closeModal()">Close</button></div></div></div>`); }
function openAddMcp(id){ modal(`<div class="modal"><div class="mh"><h3>Add MCP server to ${bot(id).name}</h3><span class="grow"></span><button class="btn ghost sm" onclick="closeModal()">✕</button></div><div class="mb"><input class="in" placeholder="Search the MCP catalog…"><div class="tpl">${Object.entries(MCP).filter(([k])=>!bot(id).mcp.some(m=>m.k===k)).map(([k,m])=>`<div class="tplc" onclick="bot('${id}').mcp.push({k:'${k}',pol:Object.fromEntries(MCP['${k}'].tools.map(([t])=>[t,'ask']))});closeModal();render();toast('${m.name} added · all tools set to Ask, tighten as needed')"><div class="ic">${m.lg}</div><div class="t">${m.name}</div><div class="s">${m.tools.length} tools · ${k==='github'?'<span class="down">needs auth</span>':'<span class="up">connected</span>'}</div></div>`).join('')}</div><div class="small muted">Not here? <a href="#" onclick="toast('Opens Settings → MCP catalog');return false">Add or connect a server in the MCP catalog</a>. Bots never hold their own credentials.</div></div></div>`); }
function openPalette(){ modal(`<div class="modal palette"><input autofocus placeholder="Jump to a bot, item, tool, or run a command…"><div class="r" onclick="closeModal();go('#/new/1')">＋ New bot <span class="k"><kbd>N</kbd></span></div>${BOTS.slice(0,5).map(b=>`<div class="r" onclick="closeModal();go('#/bots/${b.id}/overview')">${b.icon} ${b.name} <span class="small muted">${b.mode}</span></div>`).join('')}<div class="r" onclick="closeModal();toggleKill()">⛔ Toggle kill switch</div><div class="r" onclick="closeModal();go('#/templates')">🧩 Templates</div></div>`); setTimeout(()=>document.querySelector('.palette input')?.focus(),0); }
function toggleKill(){ S.kill=!S.kill; S.running=null; render(); toast(S.kill?'⛔ Kill switch ON · all bots halted':'✅ Bots resumed'); }
function toast(msg, action){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=msg+(action?` <button class="btn sm" style="background:transparent;color:inherit;border-color:currentColor" onclick="this.parentElement.remove()">${action}</button>`:''); $('#toasts').appendChild(t); setTimeout(()=>t.remove(),3800); }

/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,[contenteditable]')) return;
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openPalette();return;}
  if(e.key==='Escape'){closeModal();return;}
  const inInbox = S.view==='inbox' || (S.view==='bots'&&S.tab==='inbox');
  if(!inInbox) { if(e.key==='n') go('#/new/1'); return; }
  const list = ITEMS.filter(i=>(S.filter==='all'||i.status===S.filter)&&(S.botFilter==='all'||i.bot===S.botFilter)); const idx=list.findIndex(i=>i.id===S.itemId);
  if(e.key==='j'){ S.itemId=(list[idx+1]||list[0])?.id; render(); document.getElementById('item-'+S.itemId)?.scrollIntoView({block:'nearest'}); }
  if(e.key==='k'){ S.itemId=(list[idx-1]||list[list.length-1])?.id; render(); document.getElementById('item-'+S.itemId)?.scrollIntoView({block:'nearest'}); }
  if(e.key===' '){ e.preventDefault(); toggleSel(S.itemId); }
  const cur=ITEMS.find(i=>i.id===S.itemId); if(!cur||cur.status!=='pending') return; const b=bot(cur.bot);
  if(e.key==='a'){ const a=b.actions.find(x=>x.kind==='approve'); if(a) act(cur.id,a.label,'approve',true); }
  if(e.key==='d'){ act(cur.id,'Dismiss','dismiss',true); }
  if(e.key==='r'){ const a=b.actions.find(x=>x.kind==='reply'); if(a) act(cur.id,a.label,'reply',false); }
});
parse();
</script>
</body>
