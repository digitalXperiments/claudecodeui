<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>CloudCLI UI</title>

    <!-- Fonts are self-hosted via @fontsource (imported in src/main.jsx) with
         font-display: swap, so there is no render-blocking cross-origin CSS. -->

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials"  />
    
    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Claude UI" />
    
    <!-- iOS Safari Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    
    <!-- Theme Color (bootstrap script below overwrites before paint when dark) -->
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="msapplication-TileColor" content="#f6f4ef" />

    <!--
      Pre-paint theme bootstrap — must stay in sync with ThemeContext.jsx:
      localStorage key "theme" with values light | dark | system (default system).
      Only sets the initial class; ThemeContext remains source of truth after mount.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var mode = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) themeColor.setAttribute('content', '#141414');
            var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
            if (statusBar) statusBar.setAttribute('content', 'black-translucent');
            var tile = document.querySelector('meta[name="msapplication-TileColor"]');
            if (tile) tile.setAttribute('content', '#141414');
          }
        } catch (e) { /* private mode / blocked storage — ThemeContext will apply after mount */ }
      })();
    </script>
    
    <!-- Prevent zoom on iOS -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Static app shell styles: mirrors AuthLoadingScreen so the first paint
         happens before any JS runs. Scoped to #app-shell; React replaces it. -->
    <style>
      #app-shell{position:relative;display:flex;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif;color:#0d0b08;background:#f7f6f3}
      html.dark #app-shell{color:#efeeec;background:#141414}
      #app-shell .glow{position:absolute;top:-10rem;left:50%;width:36rem;height:36rem;transform:translateX(-50%);border-radius:9999px;background:rgba(37,99,235,.1);filter:blur(64px)}
      #app-shell .mark{display:flex;width:4rem;height:4rem;margin:0 auto 1.25rem;align-items:center;justify-content:center;border-radius:1rem;background:linear-gradient(to bottom right,#2563eb,rgba(37,99,235,.8));box-shadow:0 10px 15px -3px rgba(37,99,235,.25)}
      html.dark #app-shell .mark{background:linear-gradient(to bottom right,#3b82f6,rgba(59,130,246,.8))}
      #app-shell h1{margin:0 0 1rem;font-size:1.5rem;line-height:2rem;font-weight:700;letter-spacing:-.025em}
      #app-shell .dots{display:flex;gap:.5rem;justify-content:center}
      #app-shell .dots i{width:.5rem;height:.5rem;border-radius:9999px;background:#2563eb;animation:shell-bounce 1s infinite}
      html.dark #app-shell .dots i{background:#3b82f6}
      #app-shell .dots i:nth-child(2){animation-delay:.15s}
      #app-shell .dots i:nth-child(3){animation-delay:.3s}
      @keyframes shell-bounce{0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(.8,0,1,1)}50%{transform:none;animation-timing-function:cubic-bezier(0,0,.2,1)}}
    </style>
  </head>
  <body>
    <div id="root"><div id="app-shell" role="status" aria-live="polite"><div class="glow" aria-hidden="true"></div><div style="position:relative;text-align:center"><div class="mark"><img src="/logo.svg" alt="CloudCLI" width="36" height="36" /></div><h1>CloudCLI</h1><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Service worker registration lives in src/main.jsx (once, at idle). -->
  </body>
</html>
